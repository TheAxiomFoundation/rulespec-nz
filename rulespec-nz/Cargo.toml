[package]
name = "rulespec-nz"
version = "0.1.0"
edition = "2021"

[lib]
name = "rulespec_nz"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python-extension"]
python = ["dep:arrow", "dep:polars", "dep:pyo3"]
python-extension = ["python", "pyo3/extension-module"]
wasm = ["dep:wasm-bindgen"]

[dependencies]
arrow = { version = "51.0", optional = true }
polars = { version = "0.38.0", features = ["lazy"], optional = true }
pyo3 = { version = "0.21.0", features = ["abi3-py38"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
wasm-bindgen = { version = "0.2", optional = true }
chrono = "=0.4.38"
