version: 1
allowed_root_directories:
  - .agents
  - .axiom
  - .codex
  - .github
  - conductor
  - data
  - docs
  - nz
  - rulespec-nz
  - scripts
  - src
  - tests
  - verification
allowed_root_files:
  - .editorconfig
  - .gitattributes
  - .gitignore
  - .pre-commit-config.yaml
  - AGENTS.md
  - CLAUDE.md
  - CONTRIBUTING.md
  - GEMINI.md
  - LICENSE
  - LICENSE-CODE
  - Makefile
  - NOTICE
  - README.md
  - VERIFY.md
  - _update_inventory.py
  - _write_phase2.py
  - conftest.py
  - known-missing-money-atoms.yaml
  - known-validation-gaps.yaml
  - pixi.lock
  - pixi.toml
  - pyproject.toml
  - test_bindings.py
  - uv.lock
  - variables.toml
path_rules:
  - patterns:
      - ".agents/**"
    allow_extensions:
      - ".md"
  - patterns:
      - ".axiom/encoding-manifests/**"
    allow_extensions:
      - ".json"
  - patterns:
      - ".axiom/**"
    allow_extensions:
      - ".toml"
      - ".yaml"
  - patterns:
      - ".codex/**"
    allow_extensions:
      - ".json"
      - ".md"
      - ".toml"
  - patterns:
      - ".github/**"
    allow_extensions:
      - ".md"
      - ".yml"
      - ".yaml"
    allow_filenames:
      - CODEOWNERS
  - patterns:
      - "conductor/**"
    allow_extensions:
      - ".json"
      - ".md"
  - patterns:
      - "data/**"
    allow_extensions:
      - ".json"
      - ".jsonl"
      - ".md"
      - ".yaml"
      - ".yml"
  - patterns:
      - "docs/**"
    allow_extensions:
      - ".md"
  - patterns:
      - "nz/**"
    allow_extensions:
      - ".yaml"
    allow_filenames:
      - ".gitkeep"
  - patterns:
      - "rulespec-nz/**"
    allow_extensions:
      - ".rs"
      - ".toml"
    allow_filenames:
      - Cargo.lock
  - patterns:
      - "scripts/**"
    allow_extensions:
      - ".py"
  - patterns:
      - "src/**"
    allow_extensions:
      - ".py"
  - patterns:
      - "tests/**"
    allow_extensions:
      - ".py"
  - patterns:
      - "verification/releases/**"
    allow_extensions:
      - ".json"
      - ".pem"
      - ".pub"
      - ".sig"
      - ".tsr"
  - patterns:
      - "verification/**"
    allow_extensions:
      - ".json"
      - ".jsonl"
      - ".md"
      - ".py"
