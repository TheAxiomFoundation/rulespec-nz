name: Repository Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    uses: TheAxiomFoundation/.github/.github/workflows/validate-rulespec.yml@589811b853533c2942750fcc82351de9a6d94131
    secrets:
      AXIOM_ENCODE_APPLY_SIGNING_KEY: ${{ secrets.AXIOM_ENCODE_APPLY_SIGNING_KEY }}
    with:
      validate-roots: auto
      run-generated-guard: true

  roadmap-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check roadmap coverage state
        run: python scripts/nz_full_country_roadmap_sync.py --check
