name: Repository Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    uses: TheAxiomFoundation/.github/.github/workflows/validate-rulespec.yml@4dd0974e6064617b43a2dd4f9f5d05bacb09c62d
    secrets: inherit
    with:
      axiom-encode-ref: 39391c3b931556535a5bc470a9da858ad97a7f67
      axiom-rules-engine-ref: 05eac9d2f89dabe5c6673176260762cef3a58f47
      axiom-corpus-ref: 0a3e5c3dbb32a403dfcb2a106f5ccfefbd4a189c
      rulespec-us-ref: 0f291b367bf7e15555f9973112278c5cbf221653
      validate-roots: auto
      run-generated-guard: false


  roadmap-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check roadmap coverage state
        run: python scripts/nz_full_country_roadmap_sync.py --check

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0
      - name: Run repository quality gate
        run: pixi run quality
