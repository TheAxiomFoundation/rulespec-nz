name: Repository Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    uses: TheAxiomFoundation/.github/.github/workflows/validate-rulespec.yml@0a755cd88b8ac2fabd1b48f46730c5a244186692
    secrets: inherit
    with:
      axiom-encode-ref: 6cc3f8a59539e5abacbf351b913db98877cf6579
      axiom-rules-engine-ref: de0efdc73b469132ee268e1c832e8f7148b91431
      axiom-corpus-ref: ad294991b0dccaafb0b0e920617b2f66498237cd
      rulespec-us-ref: 0f291b367bf7e15555f9973112278c5cbf221653
      validate-roots: auto
      run-generated-guard: true


  roadmap-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check roadmap coverage state
        run: python scripts/nz_full_country_roadmap_sync.py --check

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0
      - name: Run repository quality gate
        run: pixi run quality
