- name: weekly_compensation_uses_eighty_percent_replacement_rate
  period:
    period_kind: tax_year
    start: '2026-04-01'
    end: '2027-03-31'
  input:
    nz:statutes/acc/weekly_compensation#input.acc_weekly_compensation_weekly_earnings: 1000
    nz:statutes/acc/weekly_compensation#input.acc_weekly_compensation_entitled: true
    nz:statutes/acc/weekly_compensation#input.acc_weekly_compensation_full_time_earner_qualifies_for_minimum: false
  output:
    nz:statutes/acc/weekly_compensation#acc_weekly_compensation_base_amount: 800
    nz:statutes/acc/weekly_compensation#acc_weekly_compensation_weekly_payable: 800

