format: rulespec/v1
module:
  summary: |-
    Accident Compensation Act 2001 weekly compensation is earnings-based and
    generally pays 80 percent of pre-injury weekly income, subject to the ACC
    earnings cap and the full-time minimum weekly compensation floor published
    by ACC. The same minimum-rate surface is used for loss of potential
    earnings for young injured people who cannot work full time because of
    their injury.
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: nz/statute/act/public/2001/0049/schedule/1/part/2/clause/32
units:
  - name: NZD
    kind: currency
    minor_units: 2
rules:
  - name: acc_weekly_compensation_rate
    kind: parameter
    dtype: Rate
    source: ACC weekly compensation guidance
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: nz/guidance/acc/weekly-compensation-for-employees/block-3
              excerpt: We calculate your payment based on 80% of your average weekly earnings before your injury.
    versions:
      - effective_from: '2025-04-01'
        formula: |-
          0.8
  - name: acc_loss_of_potential_earnings_rate
    kind: parameter
    dtype: Rate
    source: ACC loss of potential earnings guidance
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: nz/guidance/acc/weekly-compensation-for-employees/block-14
              excerpt: We can make weekly payments at 80% of the weekly minimum wage.
    versions:
      - effective_from: '2025-04-01'
        formula: |-
          0.8
  - name: acc_weekly_minimum_wage_40_hour_week
    kind: parameter
    dtype: Money
    unit: NZD
    source: ACC weekly compensation and loss of potential earnings guidance
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: nz/guidance/acc/weekly-compensation
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: nz/guidance/acc/loss-of-potential-earnings
          - path: versions[1].formula
            kind: parameter
            source:
              corpus_citation_path: nz/guidance/acc/client-payment-rates-2026-04/block-2
              excerpt: The new gross minimum rate of weekly compensation payable to a full-time earner will be $766.40 (equal to 80% of the adult minimum wage of $958.00 for a 40-hour week).
          - path: versions[1].formula
            kind: parameter
            source:
              corpus_citation_path: nz/guidance/acc/client-payment-rates-2026-04/block-2
              excerpt: The new gross minimum rate of weekly compensation payable to a full-time earner will be $766.40 (equal to 80% of the adult minimum wage of $958.00 for a 40-hour week).
    versions:
      - effective_from: '2025-04-01'
        formula: |-
          940
      - effective_from: '2026-04-01'
        formula: |-
          958
  - name: acc_weekly_compensation_minimum_full_time_rate
    kind: derived
    entity: Person
    dtype: Money
    period: Week
    unit: NZD
    source: ACC weekly compensation guidance
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/guidance/acc/client-payment-rates-2026-04/block-2
              excerpt: The new gross minimum rate of weekly compensation payable to a full-time earner will be $766.40 (equal to 80% of the adult minimum wage of $958.00 for a 40-hour week).
    versions:
      - effective_from: '2025-04-01'
        formula: |-
          acc_weekly_minimum_wage_40_hour_week * acc_weekly_compensation_rate
  - name: acc_weekly_compensation_earnings_cap_weekly
    kind: derived
    entity: Person
    dtype: Money
    period: Week
    unit: NZD
    source: Accident Compensation Act 2001 and ACC levy maximum earnings interface
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2001/0049/schedule/1/part/2/clause/46
              excerpt: The maximum amount of weekly compensation for loss of earnings that the Corporation is liable to pay to a claimant is $1,341.31 a week, whatever amount is calculated under this schedule.
    versions:
      - effective_from: '2025-04-01'
        formula: |-
          acc_earners_levy_maximum_earnings / 52
  - name: acc_weekly_compensation_eligible
    kind: derived
    entity: Person
    dtype: Judgment
    period: Week
    source: ACC weekly compensation guidance
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/guidance/acc/weekly-compensation/block-1
              excerpt: You need to be an employee, self-employed or a shareholder-employee. This must be at the time of the accident and on the day of, or day before your medical certificate shows you are unable to do some or all of your usual work duties.
    versions:
      - effective_from: '2025-04-01'
        formula: |-
          (
              acc_weekly_compensation_employed_or_self_employed_or_shareholder_employee
              and acc_weekly_compensation_cannot_do_usual_work_due_to_injury
          )
  - name: acc_weekly_compensation_pre_injury_income_capped
    kind: derived
    entity: Person
    dtype: Money
    period: Week
    unit: NZD
    source: ACC weekly compensation guidance
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/guidance/acc/weekly-compensation-for-employees/block-3
              excerpt: There is also a maximum weekly amount based on a 40-hour week.
    versions:
      - effective_from: '2025-04-01'
        formula: |-
          min(
              max(0, acc_weekly_compensation_pre_injury_weekly_earnings),
              acc_weekly_compensation_earnings_cap_weekly
          )
  - name: acc_weekly_compensation_before_abatement
    kind: derived
    entity: Person
    dtype: Money
    period: Week
    unit: NZD
    source: ACC weekly compensation guidance
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/guidance/acc/client-payment-rates-2026-04/block-2
              excerpt: The new gross minimum rate of weekly compensation payable to a full-time earner will be $766.40 (equal to 80% of the adult minimum wage of $958.00 for a 40-hour week).
    versions:
      - effective_from: '2025-04-01'
        formula: |-
          if acc_weekly_compensation_eligible:
              if acc_weekly_compensation_is_full_time_earner:
                  max(
                      acc_weekly_compensation_minimum_full_time_rate,
                      acc_weekly_compensation_pre_injury_income_capped
                      * acc_weekly_compensation_rate
                  )
              else:
                  acc_weekly_compensation_pre_injury_income_capped * acc_weekly_compensation_rate
          else:
              0
  - name: acc_weekly_compensation_after_abatement
    kind: derived
    entity: Person
    dtype: Money
    period: Week
    unit: NZD
    source: ACC weekly compensation guidance
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/guidance/acc/weekly-compensation-for-employees/block-8
              excerpt: If you earn any income while receiving weekly compensation, we'll adjust your payments. This is called abatement, and helps reduce the risk of overpayment. Your total income should not be more than your usual pay, so you'll need to tell us if you work or earn income while receiving weekly compensation.
    versions:
      - effective_from: '2025-04-01'
        formula: |-
          max(
              0,
              acc_weekly_compensation_before_abatement
              - max(0, acc_weekly_compensation_income_while_recovering)
          )
  - name: acc_loss_of_potential_earnings_entitled
    kind: derived
    entity: Person
    dtype: Judgment
    period: Week
    source: ACC loss of potential earnings guidance
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/guidance/acc/weekly-compensation-for-employees/block-13
              excerpt: |-
                If your injury is stopping you from starting full-time work of at least 30 hours per week, we may be able to pay you for loss of earnings. You could be eligible if:

                you've turned 18

                you were injured before you turned 18, or injured after turning 18 but you've been in full-time study or training

                you can't work because of your injury for six months or more

                you're no longer in full-time study or training

                you're earning or already getting weekly compensation but it's less than what we'd pay for loss of potential earnings.
    versions:
      - effective_from: '2025-04-01'
        formula: |-
          (
              acc_loss_of_potential_earnings_turned_18
              and acc_loss_of_potential_earnings_injured_before_18_or_in_full_time_study_training
              and acc_loss_of_potential_earnings_cannot_work_for_six_months_or_more
              and acc_loss_of_potential_earnings_no_longer_in_full_time_study_or_training
              and acc_loss_of_potential_earnings_current_income_below_lpe_rate
          )
  - name: acc_loss_of_potential_earnings_weekly_payment
    kind: derived
    entity: Person
    dtype: Money
    period: Week
    unit: NZD
    source: ACC loss of potential earnings guidance
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/guidance/acc/weekly-compensation-for-employees/block-14
              excerpt: We can make weekly payments at 80% of the weekly minimum wage.
    versions:
      - effective_from: '2025-04-01'
        formula: |-
          if acc_loss_of_potential_earnings_entitled:
              acc_weekly_minimum_wage_40_hour_week * acc_loss_of_potential_earnings_rate
          else:
              0
