          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          (
              not common_unlawfully_resident_or_present_in_new_zealand
              or common_new_zealand_citizen
              or common_residence_class_visa_holder
              or common_temporary_entry_class_visa_holder
