format: rulespec/v1
module:
  summary: |-
    Residence, citizenship, and immigration predicates used across NZ benefit
    and tax programs. Official-source encoding draws from Citizenship Act
    1977, Immigration Act 2009, Social Security Act 2018, and ordinary
    residence guidance.
  status: active
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: nz/statute/act/public/2009/0051/section/13
rules:
  - name: common_new_zealand_citizen
    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
    source: Citizenship Act 1977 and Immigration Act 2009
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/1977/0061
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2009/0051
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          common_new_zealand_citizen_input
  - name: common_residence_class_visa_holder
    kind: derived
    entity: Person
