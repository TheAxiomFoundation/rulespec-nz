format: rulespec/v1
module:
  summary: |-
    Residence, citizenship, and immigration predicates used across NZ benefit
    and tax programs. Official-source encoding draws from Citizenship Act
    1977, Immigration Act 2009, Social Security Act 2018, and ordinary
    residence guidance.
  status: active
  source_verification:
    corpus_citation_paths:
      - nz/statute/act/public/1977/0061
      - nz/statute/act/public/2009/0051
      - nz/statute/act/public/2018/0032
    agency_reference_urls:
      - https://www.studylink.govt.nz/about-studylink/glossary/ordinarily-resident.html
    oracle_links:
      - openfisca-aotearoa
rules:
  - name: common_new_zealand_citizen
    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
    source: Citizenship Act 1977 and Immigration Act 2009
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          common_new_zealand_citizen_input
  - name: common_residence_class_visa_holder
    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
    source: Immigration Act 2009
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          common_residence_class_visa_holder_input
  - name: common_temporary_entry_class_visa_holder
    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
    source: Immigration Act 2009
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          common_temporary_entry_class_visa_holder_input
  - name: common_unlawfully_resident_or_present_in_new_zealand
    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
    source: Immigration Act 2009
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          common_unlawfully_resident_or_present_in_new_zealand_input
  - name: common_ordinarily_resident_in_new_zealand
    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
    source: Social Security Act 2018 and StudyLink ordinary-residence guidance
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          common_ordinarily_resident_in_new_zealand_input
  - name: common_entitled_to_be_in_new_zealand_indefinitely
    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
    source: Citizenship Act 1977 and Immigration Act 2009
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          common_entitled_to_be_in_new_zealand_indefinitely_input
  - name: common_lawful_presence_requirement
    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
    source: Immigration Act 2009 and Social Security Act 2018
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          (
              not common_unlawfully_resident_or_present_in_new_zealand
              and not common_temporary_entry_class_visa_holder
          )
  - name: common_resident_status
    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
    source: Social Security Act 2018
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          (
              common_new_zealand_citizen
              or common_residence_class_visa_holder
          )
