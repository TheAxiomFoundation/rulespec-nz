format: rulespec/v1
module:
  summary: |-
    New Zealand Superannuation and Retirement Income Act 2001 sections 4A,
    7, 8, 11, and 12 set living-alone status, age qualification, residential
    qualification, commencement, and rates. Schedule 1 Part 1 sets ordinary
    weekly rates before tax. This module encodes the ordinary domestic
    entitlement and rate surface; overseas payment, refugee special residence,
    hospital rates, and saved non-qualifying-spouse rates are left for
    follow-on slices.
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: nz/statute/act/public/2001/0084/section/7
units:
  - name: NZD
    kind: currency
    minor_units: 2
