  - name: accommodation_supplement_cash_assets_within_limit
    kind: derived
    entity: Family
    dtype: Judgment
    period: Year
    source: Social Security Act 2018 s 65(1)(b); Social Security Regulations 2018 reg 15
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/section/65
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/regulation/regulation/public/2018/0202/regulation/15
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          (
              (
                  (
                      accommodation_supplement_in_relationship
                      or accommodation_supplement_has_dependent_children
                  )
                  and (
                      accommodation_supplement_cash_assets
                      <= accommodation_supplement_cash_asset_limit_partnered_or_with_children
                  )
              )
              or (
                  not accommodation_supplement_in_relationship
                  and not accommodation_supplement_has_dependent_children
                  and accommodation_supplement_cash_assets <= accommodation_supplement_cash_asset_limit_other
              )
          )
  - name: accommodation_supplement_social_housing_exclusion_not_applies
    kind: derived
    entity: Family
    dtype: Judgment
    period: Year
    source: Social Security Act 2018 s 66
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/section/66
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          (
              not accommodation_supplement_rent_paid_to_kainga_ora
              and not accommodation_supplement_rent_paid_to_registered_community_housing_provider_social_housing
              and not accommodation_supplement_concessionary_mortgage_payments_to_kainga_ora_or_crown
          )
  - name: accommodation_supplement_other_funding_exclusion_not_applies
    kind: derived
    entity: Family
    dtype: Judgment
    period: Year
    source: Social Security Act 2018 s 67
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/section/67
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          (
              (
                  not accommodation_supplement_partner_receiving_accommodation_supplement
                  or accommodation_supplement_section_68_joint_tenant_exception_applies
              )
              and not accommodation_supplement_receiving_or_eligible_for_student_allowance_grant
              and not accommodation_supplement_residential_care_funded_under_residential_care_act
              and not accommodation_supplement_disability_accommodation_or_care_funded_under_pae_ora_act
              and not accommodation_supplement_super_or_veterans_pension_income_above_schedule_5_limit
          )
  - name: accommodation_supplement_non_rate_entitlement_requirements
    kind: derived
    entity: Family
    dtype: Judgment
    period: Year
    source: Social Security Act 2018 ss 65 to 67
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/section/65
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/section/66
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/section/67
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          (
              accommodation_supplement_has_accommodation_costs
              and accommodation_supplement_cash_assets_within_limit
              and accommodation_supplement_social_housing_exclusion_not_applies
              and accommodation_supplement_other_funding_exclusion_not_applies
          )
  - name: accommodation_supplement_weekly_accommodation_costs
    kind: derived
    entity: Family
    dtype: Money
    period: Year
    unit: NZD
    source: Social Security Act 2018 s 65AAA definition of accommodation costs
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/section/65aaa
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if accommodation_supplement_owns_premises_and_not_joint_owner_with_resident:
              accommodation_supplement_owner_weekly_required_payments
          else:
              if accommodation_supplement_joint_owner_with_resident:
                  accommodation_supplement_owner_weekly_payment_share
              else:
                  if accommodation_supplement_additional_resident_in_social_housing:
                      (
                          accommodation_supplement_social_housing_weekly_contributions_paid
                          * accommodation_supplement_board_and_contribution_fraction
                      )
                  else:
                      if accommodation_supplement_boarder:
                          (
                              accommodation_supplement_weekly_board_and_lodgings_paid
                              * accommodation_supplement_board_and_contribution_fraction
                          )
                      else:
                          accommodation_supplement_weekly_rent_paid
  - name: accommodation_supplement_weekly_accommodation_income
    kind: derived
    entity: Family
    dtype: Money
    period: Year
    unit: NZD
    source: Social Security Act 2018 Schedule 4 Part 7 clause 7 definition of accommodation income
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/schedule/4/part/7/clause/lms118453
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          (
              max(0, accommodation_supplement_weekly_rent_received_from_other_residents)
              + (
                  max(
                      0,
                      accommodation_supplement_weekly_contributions_received_from_additional_residents
                  )
                  * accommodation_supplement_board_and_contribution_fraction
              )
              + (
                  max(0, accommodation_supplement_weekly_boarder_payments_received)
                  * accommodation_supplement_board_and_contribution_fraction
              )
          )
  - name: accommodation_supplement_weekly_qualifying_accommodation_costs
    kind: derived
    entity: Family
    dtype: Money
    period: Year
    unit: NZD
    source: Social Security Act 2018 Schedule 4 Part 7 clause 7 definition of weekly qualifying accommodation costs
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/schedule/4/part/7/clause/lms118453
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if accommodation_supplement_total_premises_area > 0:
              max(
                  0,
                  (
                      accommodation_supplement_weekly_accommodation_costs
                      * (
                          accommodation_supplement_full_premises_area_ratio
                          - (
                              (
                                  accommodation_supplement_business_use_area
                                  + accommodation_supplement_self_contained_area_let_to_residents
                                  + accommodation_supplement_area_let_to_nonresidents
                              )
                              / accommodation_supplement_total_premises_area
                          )
                      )
                  )
                  - accommodation_supplement_weekly_accommodation_income
              )
          else:
              max(
                  0,
                  accommodation_supplement_weekly_accommodation_costs
                  - accommodation_supplement_weekly_accommodation_income
              )
  - name: accommodation_supplement_entry_threshold_rate
    kind: derived
    entity: Family
    dtype: Rate
    period: Year
    source: Social Security Act 2018 Schedule 4 Part 7 clauses 1 to 6
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/schedule/4/part/7/clause/lms118453
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if accommodation_supplement_costs_are_homeownership:
              accommodation_supplement_homeownership_entry_threshold_rate
          else:
              accommodation_supplement_rent_board_entry_threshold_rate
  - name: accommodation_supplement_entry_threshold_weekly_amount
    kind: derived
    entity: Family
    dtype: Money
    period: Year
    unit: NZD
    source: Social Security Act 2018 Schedule 4 Part 7 clauses 1 to 6; Social Security Regulations 2018 reg 17
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/schedule/4/part/7/clause/lms118453
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/regulation/regulation/public/2018/0202/regulation/17
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          (
              accommodation_supplement_base_rate_weekly_amount
              * accommodation_supplement_entry_threshold_rate
          )
  - name: accommodation_supplement_maximum_weekly_rate
    kind: derived
    entity: Family
    dtype: Money
    period: Year
    unit: NZD
    source: Social Security Act 2018 Schedule 4 Part 7 clauses 1 to 6; Work and Income 1 April 2026 Accommodation Supplement maximum rates
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/schedule/4/part/7/clause/lms118453
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/guidance/msd/accommodation-supplement-rates-2026
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if (
              (
                  accommodation_supplement_in_relationship
                  and accommodation_supplement_has_dependent_children
              )
              or (
                  accommodation_supplement_sole_parent
                  and accommodation_supplement_has_two_or_more_dependent_children
              )
          ):
              if accommodation_supplement_resides_in_area_1:
                  accommodation_supplement_large_family_area_1_maximum_weekly_rate
              else:
                  if accommodation_supplement_resides_in_area_2:
                      accommodation_supplement_large_family_area_2_maximum_weekly_rate
                  else:
                      if accommodation_supplement_resides_in_area_3:
                          accommodation_supplement_large_family_area_3_maximum_weekly_rate
                      else:
                          accommodation_supplement_large_family_area_4_maximum_weekly_rate
          else:
              if (
                  (
                      accommodation_supplement_in_relationship
                      and not accommodation_supplement_has_dependent_children
                  )
                  or (
                      accommodation_supplement_sole_parent
                      and accommodation_supplement_has_dependent_children
                      and not accommodation_supplement_has_two_or_more_dependent_children
                  )
              ):
