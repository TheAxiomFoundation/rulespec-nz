format: rulespec/v1
module:
  summary: |-
    Social Security Act 2018 sections 65 to 69 set Accommodation Supplement
    entitlement gates, section 65AAA defines accommodation costs, Schedule 4
    Part 7 sets the weekly formula and maximums by area and family category,
    and Social Security Regulations 2018 regulations 15 to 19 set the asset
    limits, delegated base-rate mechanics, income reduction for
    non-beneficiaries, and dollar rounding. This module encodes the executable
    core calculation while taking the delegated base rate and non-beneficiary
    income cutout as inputs for later cross-module wiring.
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: nz/statute/act/public/2018/0032/section/65aaa
units:
  - name: NZD
    kind: currency
    minor_units: 2
