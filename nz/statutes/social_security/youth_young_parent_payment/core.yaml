format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: nz/statute/act/public/2018/0032/schedule/4/part/6/subpart/1
  summary: |-
    Social Security Act 2018, youth payment (s 49) and young parent payment
    (s 56) entitlement requirements, the Schedule 4 Part 6 subpart 1 weekly
    rate scale, and the subpart 4 income test (clauses 11-13). The youth
    payment supports 16-17 year olds who are study ready with no dependent
    children; the young parent payment supports young parents aged 16-19.

    Entitlement follows the statutory conjunct structure exactly. Youth
    payment (s 49): age 16 or 17, study ready, no dependent children,
    residential requirement, no or minimum income, and either (never in a
    relationship AND parental support gap) or (is or has been in a
    relationship AND not currently in a relationship with a specified
    beneficiary). Young parent payment (s 56): parent or step-parent of at
    least one dependent child - a dependent child of the person's spouse or
    partner counts as theirs (s 56(2)) - study ready, residential
    requirement, no or minimum income, and one of the three s 56(1)(e)
    age/relationship categories. Study ready (ss 50/57), no or minimum
    income (ss 51/58), the residential requirement (s 16), and the parental
    support gap (ss 52/59) are agency-adjudicated composite inputs whose
    full statutory contracts live in those sections; ss 51(2)/58(2) preserve
    entitlement through temporary high income, which this module reflects by
    keeping entitlement judgments independent of the payable amount.

    Weekly rates (1 April 2026, verbatim in the bound PCO corpus, verified
    against the Work and Income April-2026 deskfile): $324.50 (item 1:
    single, no dependent children); $300.86 (item 2: single 16-17 living
    with or financially supported by a parent or guardian, with a dependent
    child); $521.52 (item 3: any other single young person with a dependent
    child); $316.97 (item 4: in a relationship, no dependent children);
    $334.70 (item 5: in a relationship with a dependent child - items 5(a)
    and 5(b) state the same amount whether or not the spouse or partner
    receives a main benefit, so the distinction does not affect the rate and
    is not encoded). Under clause 6, dependent child excludes a child for
    whom an orphan's benefit or unsupported child's benefit is paid; the
    dependent-child inputs carry that exclusion.

    Income test (subpart 4): single rates (items 1-3) reduce $1 for every $1
    of the young person's weekly income excluding information share child
    support payments above $284.70, with nothing payable when that non-child-
    support income exceeds $334.70 (clause 11); clauses 11A-11B then reduce
    $1 for every $1 of child support payments beyond the unused part of the
    same $284.70 threshold. Partnered rates (items 4-5) reduce 50 cents per
    $1 of combined income on the same structure (clauses 12-12B), with
    nothing payable when combined non-child-support income exceeds $384.70.
    Clause 13 lets MSD disregard up to $20 a week of personal earnings used
    for childcare when a young parent payment rate applies; the disregard
    actually allowed is an MSD determination carried as an input capped at
    the statutory $20.

    Out of scope of this base module, by name: the in-hand allowance and
    incentive payments (subparts 2-3, ss 55/62), hardship grants despite the
    residential requirement (ss 53/60), and post-age continuation (ss 54/61).
units:
  - name: NZD
    kind: currency
    minor_units: 2
rules:
  # ---- Weekly rate scale (Schedule 4 Part 6 subpart 1) ------------------
  - name: yp_rate_single_no_children
    kind: parameter
    dtype: Money
    unit: NZD
    source: Social Security Act 2018 Schedule 4 Part 6 item 1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/schedule/4/part/6/subpart/1
              excerpt: For a single young person without dependent children | $ 324.50 a week
    versions:
      - effective_from: '2026-04-01'
        formula: '324.50'
  - name: yp_rate_single_supported_with_child
    kind: parameter
    dtype: Money
    unit: NZD
    source: Social Security Act 2018 Schedule 4 Part 6 item 2
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/schedule/4/part/6/subpart/1
              excerpt: is living with or being financially supported by a parent or guardian; and has a dependent child or children | $ 300.86 a week
    versions:
      - effective_from: '2026-04-01'
        formula: '300.86'
  - name: yp_rate_single_other_with_child
    kind: parameter
    dtype: Money
    unit: NZD
    source: Social Security Act 2018 Schedule 4 Part 6 item 3
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/schedule/4/part/6/subpart/1
              excerpt: For any other single young person with a dependent child or children | $ 521.52 a week
    versions:
      - effective_from: '2026-04-01'
        formula: '521.52'
  - name: yp_rate_partnered_no_children
    kind: parameter
    dtype: Money
    unit: NZD
    source: Social Security Act 2018 Schedule 4 Part 6 item 4
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/schedule/4/part/6/subpart/1
              excerpt: For a young person who is in a relationship and is without dependent children | $ 316.97 a week
    versions:
      - effective_from: '2026-04-01'
        formula: '316.97'
  - name: yp_rate_partnered_with_child
    kind: parameter
    dtype: Money
    unit: NZD
    source: Social Security Act 2018 Schedule 4 Part 6 items 5(a) and 5(b) (same amount either way)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/schedule/4/part/6/subpart/1
              excerpt: $ 334.70 a week subject to clauses 12 and 12A if the young person’s spouse or partner is not receiving a main benefit under this Act
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/schedule/4/part/6/subpart/1
              excerpt: $ 334.70 a week subject to clauses 12 and 12A if the young person’s spouse or partner is receiving a main benefit under this Act
    versions:
      - effective_from: '2026-04-01'
        formula: '334.70'
  # ---- Ages (s 49(a); s 56(1)(e)) ----------------------------------------
  - name: yp_youth_min_age
    kind: parameter
    dtype: Number
    source: Social Security Act 2018 s 49(a)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/section/49
              excerpt: P is aged 16 or 17 years
    versions:
      - effective_from: '2026-04-01'
        formula: '16'
  - name: yp_youth_max_age
    kind: parameter
    dtype: Number
    source: Social Security Act 2018 s 49(a)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/section/49
              excerpt: P is aged 16 or 17 years
    versions:
      - effective_from: '2026-04-01'
        formula: '17'
  - name: ypp_category_ii_min_age
    kind: parameter
    dtype: Number
    source: Social Security Act 2018 s 56(1)(e)(ii)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/section/56
              excerpt: P is aged 18 or 19 years and has never been in a relationship
    versions:
      - effective_from: '2026-04-01'
        formula: '18'
  - name: ypp_max_age
    kind: parameter
    dtype: Number
    source: Social Security Act 2018 s 56(1)(e)(ii)-(iii)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/section/56
              excerpt: P is aged 16 to 19 years and is or has been in a relationship
    versions:
      - effective_from: '2026-04-01'
        formula: '19'
  # ---- Income-test parameters (Schedule 4 Part 6 subpart 4) --------------
  - name: yp_single_income_abatement_threshold
    kind: parameter
    dtype: Money
    unit: NZD
    source: Social Security Act 2018 Schedule 4 Part 6 clause 11
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/schedule/4/part/6/subpart/4
              excerpt: must be reduced by $1 for every $1 of the young person’s weekly income (excluding any 1 or more information share child support payments) that exceeds $ 284.70
    versions:
      - effective_from: '2026-04-01'
        formula: '284.70'
  - name: yp_single_income_cutout
    kind: parameter
    dtype: Money
    unit: NZD
    source: Social Security Act 2018 Schedule 4 Part 6 clause 11
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/schedule/4/part/6/subpart/4
              excerpt: no amount of youth payment or young parent payment or incentive payment is payable if the young person’s weekly income (excluding any 1 or more information share child support payments) exceeds $ 334.70
    versions:
      - effective_from: '2026-04-01'
        formula: '334.70'
  - name: yp_partnered_income_abatement_threshold
    kind: parameter
    dtype: Money
    unit: NZD
    source: Social Security Act 2018 Schedule 4 Part 6 clause 12
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/schedule/4/part/6/subpart/4
              excerpt: must be reduced by 50 cents for every $1 of the combined weekly income of the young person and the young person’s spouse or partner (excluding any 1 or more information share child support payments) that exceeds $ 284.70
    versions:
      - effective_from: '2026-04-01'
        formula: '284.70'
  - name: yp_partnered_income_cutout
    kind: parameter
    dtype: Money
    unit: NZD
    source: Social Security Act 2018 Schedule 4 Part 6 clause 12
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/schedule/4/part/6/subpart/4
              excerpt: no amount of youth payment or young parent payment or incentive payment is payable if that combined weekly income (excluding any 1 or more information share child support payments) exceeds $ 384.70
    versions:
      - effective_from: '2026-04-01'
        formula: '384.70'
  - name: yp_partnered_abatement_rate
    kind: parameter
    dtype: Rate
    source: Social Security Act 2018 Schedule 4 Part 6 clauses 12 and 12A (50 cents per $1)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/schedule/4/part/6/subpart/4
              excerpt: reduced by 50 cents for every $1 of the combined weekly income
    versions:
      - effective_from: '2026-04-01'
        formula: '0.50'
  - name: ypp_childcare_disregard_maximum
    kind: parameter
    dtype: Money
    unit: NZD
    source: Social Security Act 2018 Schedule 4 Part 6 clause 13
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/schedule/4/part/6/subpart/4
              excerpt: MSD may disregard up to $20 a week of the personal earnings of the young person
    versions:
      - effective_from: '2026-04-01'
        formula: '20'
  # ---- Youth payment entitlement (s 49) ----------------------------------
  # Study ready (s 50), no or minimum income (s 51), the residential
  # requirement (s 16), and the parental support gap (s 52) are agency-
  # adjudicated composite inputs; s 51(2) preserves entitlement through
  # temporary high income, so entitlement is independent of the payable
  # amount below.
  - name: youth_payment_entitled
    kind: derived
    entity: Person
    dtype: Judgment
    period: Week
    source: Social Security Act 2018 s 49
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: predicate
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/section/49
              excerpt: P is aged 16 or 17 years
          - path: versions[0].formula
            kind: predicate
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/section/49
              excerpt: P is study ready
          - path: versions[0].formula
            kind: predicate
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/section/49
              excerpt: P has no dependent children
          - path: versions[0].formula
            kind: predicate
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/section/49
              excerpt: P meets the residential requirement
          - path: versions[0].formula
            kind: predicate
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/section/49
              excerpt: P has no or minimum income
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/section/49
              excerpt: P has never been in a relationship and has a parental support gap
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/section/49
              excerpt: P is or has been in a relationship, but is not currently in a relationship with a specified beneficiary
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          young_person_age_years >= yp_youth_min_age
          and young_person_age_years <= yp_youth_max_age
          and young_person_is_study_ready
          and not young_person_has_dependent_child_excluding_ob_ucb
          and young_person_meets_residential_requirement
          and young_person_has_no_or_minimum_income
          and (
            (young_person_has_never_been_in_relationship and young_person_has_parental_support_gap)
            or (not young_person_has_never_been_in_relationship and not young_person_currently_with_specified_beneficiary)
          )
  # ---- Young parent payment entitlement (s 56) ---------------------------
  # The parent-or-step-parent input carries s 56(2): a dependent child of
  # the person's spouse or partner counts as the person's dependent child.
  - name: young_parent_payment_entitled
    kind: derived
    entity: Person
    dtype: Judgment
    period: Week
    source: Social Security Act 2018 s 56
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: predicate
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/section/56
              excerpt: P is a parent or step-parent of at least 1 dependent child
          - path: versions[0].formula
            kind: predicate
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/section/56
              excerpt: a dependent child of a young person’s spouse or partner must also be treated as a dependent child of the young person
          - path: versions[0].formula
            kind: predicate
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/section/56
              excerpt: P is study ready
          - path: versions[0].formula
            kind: predicate
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/section/56
              excerpt: P meets the residential requirement
          - path: versions[0].formula
            kind: predicate
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/section/56
              excerpt: P has no or minimum income
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/section/56
              excerpt: P is aged 16 or 17 years, has never been in a relationship, and has a parental support gap
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/section/56
              excerpt: P is aged 18 or 19 years and has never been in a relationship
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/section/56
              excerpt: P is aged 16 to 19 years and is or has been in a relationship, but is not currently in a relationship with a specified beneficiary
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          young_person_is_parent_or_step_parent_of_dependent_child
          and young_person_is_study_ready
          and young_person_meets_residential_requirement
          and young_person_has_no_or_minimum_income
          and (
            (young_person_age_years >= yp_youth_min_age and young_person_age_years <= yp_youth_max_age and young_person_has_never_been_in_relationship and young_person_has_parental_support_gap)
            or (young_person_age_years >= ypp_category_ii_min_age and young_person_age_years <= ypp_max_age and young_person_has_never_been_in_relationship)
            or (young_person_age_years >= yp_youth_min_age and young_person_age_years <= ypp_max_age and not young_person_has_never_been_in_relationship and not young_person_currently_with_specified_beneficiary)
          )
  # ---- Applicable gross weekly rate (Schedule 4 Part 6 items 1-5) --------
  # Item 2 requires age 16-17 AND living with or being financially
  # supported by a parent or guardian; any other single young person with a
  # dependent child takes item 3.
  - name: applicable_weekly_rate
    kind: derived
    entity: Person
    dtype: Money
    period: Week
    unit: NZD
    source: Social Security Act 2018 Schedule 4 Part 6 items 1-5
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/schedule/4/part/6/subpart/1
              excerpt: For a single young person without dependent children | $ 324.50 a week
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/schedule/4/part/6/subpart/1
              excerpt: is aged 16 to 17 years; and is living with or being financially supported by a parent or guardian
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/schedule/4/part/6/subpart/1
              excerpt: For any other single young person with a dependent child or children | $ 521.52 a week
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/schedule/4/part/6/subpart/1
              excerpt: For a young person who is in a relationship and is without dependent children | $ 316.97 a week
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if young_person_is_in_relationship:
            if young_person_has_dependent_child_excluding_ob_ucb: yp_rate_partnered_with_child
            else: yp_rate_partnered_no_children
          else: if young_person_has_dependent_child_excluding_ob_ucb:
            if young_person_age_years >= yp_youth_min_age and young_person_age_years <= yp_youth_max_age and young_person_living_with_or_supported_by_parent_or_guardian: yp_rate_single_supported_with_child
            else: yp_rate_single_other_with_child
          else: yp_rate_single_no_children
  # ---- Income counted against the rate (clauses 11-13) -------------------
  # Clause 13: MSD may disregard up to $20 of personal earnings used for
  # childcare when a young parent payment rate applies. The disregard MSD
  # actually allows is an input, capped at the statutory maximum here.
  - name: yp_counted_weekly_income_excluding_child_support
    kind: derived
    entity: Person
    dtype: Money
    period: Week
    unit: NZD
    source: Social Security Act 2018 Schedule 4 Part 6 clauses 11-13
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/schedule/4/part/6/subpart/4
              excerpt: MSD may disregard up to $20 a week of the personal earnings of the young person
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          max(0, young_person_weekly_income_excluding_child_support - (
            if young_parent_payment_entitled: min(ypp_childcare_disregard_maximum, msd_childcare_earnings_disregard_allowed)
            else: 0
          ))
  - name: yp_counted_combined_weekly_income_excluding_child_support
    kind: derived
    entity: Person
    dtype: Money
    period: Week
    unit: NZD
    source: Social Security Act 2018 Schedule 4 Part 6 clauses 12-13
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/schedule/4/part/6/subpart/4
              excerpt: the combined weekly income of the young person and the young person’s spouse or partner
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          max(0, combined_weekly_income_excluding_child_support - (
            if young_parent_payment_entitled: min(ypp_childcare_disregard_maximum, msd_childcare_earnings_disregard_allowed)
            else: 0
          ))
  # ---- Single-rate income reduction (clauses 11, 11A, 11B) ---------------
  # Clause 11 abates $1 per $1 of non-child-support income above the
  # threshold; clauses 11A-11B then abate $1 per $1 of information share
  # child support payments beyond the unused part of the same threshold.
  - name: yp_single_income_reduction
    kind: derived
    entity: Person
    dtype: Money
    period: Week
    unit: NZD
    source: Social Security Act 2018 Schedule 4 Part 6 clauses 11-11B
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/schedule/4/part/6/subpart/4
              excerpt: must be reduced by $1 for every $1 of the young person’s weekly income (excluding any 1 or more information share child support payments) that exceeds $ 284.70
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/schedule/4/part/6/subpart/4
              excerpt: that is 1 or more information share child support payments
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          max(0, yp_counted_weekly_income_excluding_child_support - yp_single_income_abatement_threshold)
          + max(0, young_person_child_support_weekly_payments - max(0, yp_single_income_abatement_threshold - yp_counted_weekly_income_excluding_child_support))
  # ---- Partnered-rate income reduction (clauses 12, 12A, 12B) ------------
  - name: yp_partnered_income_reduction
    kind: derived
    entity: Person
    dtype: Money
    period: Week
    unit: NZD
    source: Social Security Act 2018 Schedule 4 Part 6 clauses 12-12B
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/schedule/4/part/6/subpart/4
              excerpt: must be reduced by 50 cents for every $1 of the combined weekly income of the young person and the young person’s spouse or partner (excluding any 1 or more information share child support payments) that exceeds $ 284.70
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/schedule/4/part/6/subpart/4
              excerpt: reduced by 50 cents for every $1 of the relevant combined weekly income of the young person and the young person’s spouse or partner
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          yp_partnered_abatement_rate * (
            max(0, yp_counted_combined_weekly_income_excluding_child_support - yp_partnered_income_abatement_threshold)
            + max(0, combined_child_support_weekly_payments - max(0, yp_partnered_income_abatement_threshold - yp_counted_combined_weekly_income_excluding_child_support))
          )
  # ---- Base weekly payment after the income test -------------------------
  # This is the subpart 1 rate after the subpart 4 income test only; the
  # in-hand allowance, incentive payments, hardship grants (ss 53/60), and
  # post-age continuation (ss 54/61) are out of scope by name. Entitlement
  # judgments stay independent of this amount (ss 51(2)/58(2)).
  - name: base_weekly_payment_after_income_test
    kind: derived
    entity: Person
    dtype: Money
    period: Week
    unit: NZD
    source: Social Security Act 2018 Schedule 4 Part 6 subparts 1 and 4
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/schedule/4/part/6/subpart/4
              excerpt: no amount of youth payment or young parent payment or incentive payment is payable if the young person’s weekly income (excluding any 1 or more information share child support payments) exceeds $ 334.70
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/schedule/4/part/6/subpart/4
              excerpt: no amount of youth payment or young parent payment or incentive payment is payable if that combined weekly income (excluding any 1 or more information share child support payments) exceeds $ 384.70
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if not (youth_payment_entitled or young_parent_payment_entitled): 0
          else: if young_person_is_in_relationship:
            if yp_counted_combined_weekly_income_excluding_child_support > yp_partnered_income_cutout: 0
            else: max(0, applicable_weekly_rate - yp_partnered_income_reduction)
          else:
            if yp_counted_weekly_income_excluding_child_support > yp_single_income_cutout: 0
            else: max(0, applicable_weekly_rate - yp_single_income_reduction)
