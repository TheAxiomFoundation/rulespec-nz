# Companion tests for the youth payment / young parent payment.
# Rates are the 1 April 2026 Schedule 4 Part 6 amounts; the income test is the
# subpart 4 machinery: single rates abate $1 per $1 of non-child-support weekly
# income above $284.70 (cut-out when it exceeds $334.70), child support
# payments then abate beyond the unused threshold (clauses 11A-11B); partnered
# rates abate 50 cents per $1 of combined non-child-support income above
# $284.70 with a $384.70 cut-out, and clause 12A applies its 50-cent reduction
# only to relevant child-support income exceeding a further $284.70. Expected values are hand-computed with exact decimals.
- name: youth payment, age-16 boundary, never in relationship with support gap, full rate
  period:
    period_kind: tax_year
    start: '2026-04-01'
    end: '2027-03-31'
  input:
    nz:statutes/social_security/youth_young_parent_payment/core#input.young_person_age_years: 16
    nz:statutes/social_security/youth_young_parent_payment/core#input.young_person_is_study_ready: true
    nz:statutes/social_security/youth_young_parent_payment/core#input.young_person_has_dependent_child_for_part6_rates: false
    nz:statutes/social_security/youth_young_parent_payment/core#input.young_person_has_dependent_child: false
    nz:statutes/social_security/youth_young_parent_payment/core#input.young_person_meets_residential_requirement: true
    nz:statutes/social_security/youth_young_parent_payment/core#input.young_person_has_no_or_minimum_income: true
    nz:statutes/social_security/youth_young_parent_payment/core#input.young_person_has_never_been_in_relationship: true
    nz:statutes/social_security/youth_young_parent_payment/core#input.young_person_has_parental_support_gap: true
    nz:statutes/social_security/youth_young_parent_payment/core#input.young_person_currently_with_specified_beneficiary: false
    nz:statutes/social_security/youth_young_parent_payment/core#input.young_person_is_parent_or_step_parent_of_dependent_child: false
    nz:statutes/social_security/youth_young_parent_payment/core#input.young_person_is_in_relationship: false
    nz:statutes/social_security/youth_young_parent_payment/core#input.young_person_living_with_or_supported_by_parent_or_guardian: false
    nz:statutes/social_security/youth_young_parent_payment/core#input.young_person_weekly_income_excluding_child_support: 0
    nz:statutes/social_security/youth_young_parent_payment/core#input.young_person_child_support_weekly_payments: 0
    nz:statutes/social_security/youth_young_parent_payment/core#input.combined_weekly_income_excluding_child_support: 0
    nz:statutes/social_security/youth_young_parent_payment/core#input.combined_child_support_weekly_payments: 0
    nz:statutes/social_security/youth_young_parent_payment/core#input.msd_childcare_earnings_disregard_allowed: 0
  output:
    nz:statutes/social_security/youth_young_parent_payment/core#applicable_weekly_rate: 324.50
    nz:statutes/social_security/youth_young_parent_payment/core#youth_payment_entitled: holds
    nz:statutes/social_security/youth_young_parent_payment/core#young_parent_payment_entitled: not_holds
    nz:statutes/social_security/youth_young_parent_payment/core#yp_counted_weekly_income_excluding_child_support: 0
    nz:statutes/social_security/youth_young_parent_payment/core#yp_single_income_reduction: 0
    nz:statutes/social_security/youth_young_parent_payment/core#base_weekly_payment_after_income_test: 324.50
