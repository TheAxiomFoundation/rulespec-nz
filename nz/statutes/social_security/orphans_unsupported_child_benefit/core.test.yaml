# Companion tests for the orphan's benefit / unsupported child's benefit.
# Weekly rates are the 1 April 2026 amounts, verified against the Work and Income
# benefit-rates deskfile. Expected values are hand-computed with exact decimals.
- name: orphans benefit, child aged 14 or over, no child income, full rate
  period:
    period_kind: tax_year
    start: '2026-04-01'
    end: '2027-03-31'
  input:
    nz:statutes/social_security/orphans_unsupported_child_benefit/core#input.child_age_years: 15
    nz:statutes/social_security/orphans_unsupported_child_benefit/core#input.caregiver_age_years: 40
    nz:statutes/social_security/orphans_unsupported_child_benefit/core#input.caregiver_is_not_a_parent_of_child: true
    nz:statutes/social_security/orphans_unsupported_child_benefit/core#input.child_is_dependent_child_of_caregiver: true
    nz:statutes/social_security/orphans_unsupported_child_benefit/core#input.caregiver_is_principal_or_temporary_caregiver: true
    nz:statutes/social_security/orphans_unsupported_child_benefit/core#input.child_is_resident_and_present_in_nz: true
    nz:statutes/social_security/orphans_unsupported_child_benefit/core#input.caregiver_resident_and_present_12_months: false
    nz:statutes/social_security/orphans_unsupported_child_benefit/core#input.child_has_no_parent_able_to_care: true
    nz:statutes/social_security/orphans_unsupported_child_benefit/core#input.child_family_has_broken_down: false
    nz:statutes/social_security/orphans_unsupported_child_benefit/core#input.child_weekly_income_other_than_earnings: 0
  output:
    nz:statutes/social_security/orphans_unsupported_child_benefit/core#base_weekly_rate: 350.58
    nz:statutes/social_security/orphans_unsupported_child_benefit/core#is_eligible_caregiver: holds
    nz:statutes/social_security/orphans_unsupported_child_benefit/core#meets_residence_requirement: holds
    nz:statutes/social_security/orphans_unsupported_child_benefit/core#orphans_benefit_entitled: holds
    nz:statutes/social_security/orphans_unsupported_child_benefit/core#unsupported_child_benefit_entitled: not_holds
    nz:statutes/social_security/orphans_unsupported_child_benefit/core#weekly_benefit_amount: 350.58
