format: rulespec/v1
module:
  summary: |-
    Social Security Act 2018 sections 78 to 83 define Child Disability
    Allowance grant criteria, the child-with-serious-disability test, optional
    medical certificate and examination gates, payment recipient, other-benefit
    exclusions, and the Schedule 4 Part 9 weekly rate. Social Security
    Regulations 2018 regulation 49 prescribes the health practitioners for
    certificate and examination purposes.
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: nz/statute/act/public/2018/0032/section/78
units:
  - name: NZD
    kind: currency
    minor_units: 2
rules:
  - name: child_disability_allowance_constant_care_months_threshold
    kind: parameter
    dtype: Count
    source: Social Security Act 2018 s 79(1)(c)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/section/79
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          12
  - name: child_disability_allowance_weekly_rate
    kind: parameter
    dtype: Money
    unit: NZD
    source: Social Security Act 2018 Schedule 4 Part 9 clause 1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/schedule/4/part/9/clause/lms118455
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          62.43
  - name: child_disability_allowance_constant_care_duration_requirement
    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
    source: Social Security Act 2018 s 79(1)(c)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/section/79
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          (
              child_disability_allowance_likely_to_need_constant_care_permanently
              or (
                  child_disability_allowance_expected_constant_care_months
                  > child_disability_allowance_constant_care_months_threshold
              )
          )
  - name: child_disability_allowance_constant_care_considerations_present
    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
    source: Social Security Act 2018 s 79(2)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/section/79
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          (
              child_disability_allowance_requires_frequent_bodily_function_attention
              or child_disability_allowance_requires_substantially_more_attention_or_supervision
              or child_disability_allowance_requires_regular_supervision_to_avoid_substantial_danger
          )
  - name: child_disability_allowance_child_with_serious_disability
    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
    source: Social Security Act 2018 s 79
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/section/79
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          (
              child_disability_allowance_child_is_dependent_child
              and child_disability_allowance_child_has_disability
              and child_disability_allowance_child_needs_constant_care_and_attention
              and child_disability_allowance_constant_care_duration_requirement
          )
  - name: child_disability_allowance_approved_weekly_accommodation
    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
    source: Social Security Act 2018 s 78(2)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/section/78
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          (
              child_disability_allowance_accommodation_operated_by_approved_voluntary_organisation
              and child_disability_allowance_parent_or_guardian_required_to_contribute_to_accommodation_cost
          )
  - name: child_disability_allowance_care_location_requirement
    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
    source: Social Security Act 2018 s 78(1)(b) and (2)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/section/78
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          (
              child_disability_allowance_child_cared_for_in_home_of_principal_or_temporary_ob_or_ucb_caregiver
              or (
                  child_disability_allowance_approved_weekly_accommodation
                  and child_disability_allowance_child_cared_for_by_parent_or_guardian_during_school_holidays_or_weekends
              )
          )
  - name: child_disability_allowance_medical_certificate_prescribed_health_practitioner
    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
    source: Social Security Regulations 2018 reg 49
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/regulation/regulation/public/2018/0202/regulation/49
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          (
              child_disability_allowance_certificate_practitioner_acting_within_scope
              and (
                  child_disability_allowance_certificate_from_medical_practitioner
                  or child_disability_allowance_certificate_from_nurse_practitioner
              )
          )
  - name: child_disability_allowance_medical_certificate_requirement_satisfied
    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
    source: Social Security Act 2018 s 80; Social Security Regulations 2018 reg 49
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/section/80
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/regulation/regulation/public/2018/0202/regulation/49
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          (
              not child_disability_allowance_msd_requires_medical_certificate
              or (
                  child_disability_allowance_medical_certificate_prescribed_health_practitioner
                  and child_disability_allowance_certificate_certifies_child_with_serious_disability
              )
          )
  - name: child_disability_allowance_medical_examination_requirement_satisfied
    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
    source: Social Security Act 2018 s 81; Social Security Regulations 2018 reg 49
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/section/81
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/regulation/regulation/public/2018/0202/regulation/49
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          (
              not child_disability_allowance_msd_requires_medical_examination
              or child_disability_allowance_child_examined_by_prescribed_health_practitioner_nominated_by_msd
          )
  - name: child_disability_allowance_grant_criteria_met
    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
    source: Social Security Act 2018 ss 78, 80, and 81
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/section/78
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/section/80
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/section/81
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          (
              child_disability_allowance_child_with_serious_disability
              and child_disability_allowance_care_location_requirement
              and child_disability_allowance_medical_certificate_requirement_satisfied
              and child_disability_allowance_medical_examination_requirement_satisfied
          )
  - name: child_disability_allowance_excluded_by_other_assistance
    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
    source: Social Security Act 2018 s 83
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/section/83
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          (
              (
                  child_disability_allowance_child_receives_benefit_under_social_security_act
                  and not (
                      child_disability_allowance_child_receives_orphans_benefit
                      or child_disability_allowance_child_receives_unsupported_childs_benefit
                      or child_disability_allowance_child_receives_disability_allowance
                  )
              )
              or (
                  child_disability_allowance_child_receives_veterans_support_pension_or_allowance
                  and not child_disability_allowance_child_receives_veterans_support_childrens_pension
              )
              or child_disability_allowance_child_receives_acc_weekly_compensation
          )
  - name: child_disability_allowance_not_excluded_by_other_assistance
    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
    source: Social Security Act 2018 s 83
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/section/83
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          not child_disability_allowance_excluded_by_other_assistance
  - name: child_disability_allowance_payment_recipient
    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
    source: Social Security Act 2018 s 82
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/section/82
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          (
              child_disability_allowance_person_is_principal_or_temporary_ob_or_ucb_caregiver_for_child
              or (
                  child_disability_allowance_no_principal_or_temporary_ob_or_ucb_caregiver_for_child
                  and child_disability_allowance_person_has_care_and_control_of_child
              )
          )
  - name: child_disability_allowance_payable_to_person
    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
    source: Social Security Act 2018 ss 78, 82, and 83
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/section/78
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/section/82
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/section/83
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          (
              child_disability_allowance_grant_criteria_met
              and child_disability_allowance_not_excluded_by_other_assistance
              and child_disability_allowance_payment_recipient
          )
  - name: child_disability_allowance_weekly_payment
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: NZD
    source: Social Security Act 2018 ss 78, 82, and 83; Schedule 4 Part 9 clause 1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/section/78
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/section/82
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/section/83
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if child_disability_allowance_payable_to_person:
              child_disability_allowance_weekly_rate
          else:
              0
