format: rulespec/v1
module:
  summary: |-
    Social Security Act 2018 sections 70 to 75 set Winter Energy Payment
    purpose, definitions, entitlement, elections, instalments, and termination.
    Section 220 sets the special absence rule, and Schedule 4 Part 8 sets the
    per-winter-period rates and dependent-child category. This module encodes
    the executable entitlement and payment surface, leaving MSD selections,
    reviews, and care-funding determinations as factual inputs.
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: nz/statute/act/public/2018/0032/section/70
units:
  - name: NZD
    kind: currency
    minor_units: 2
rules:
  - name: winter_energy_payment_single_no_dependent_children_rate_per_winter_period
    kind: parameter
    dtype: Money
    unit: NZD
    source: Social Security Act 2018 Schedule 4 Part 8 clause 1(a)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/schedule/4/part/8/clause/lms118454
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          450
  - name: winter_energy_payment_other_rate_per_winter_period
    kind: parameter
    dtype: Money
    unit: NZD
    source: Social Security Act 2018 Schedule 4 Part 8 clause 1(b) and (c)
    metadata:
