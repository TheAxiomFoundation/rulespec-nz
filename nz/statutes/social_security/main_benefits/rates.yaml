  - name: main_benefit_income_test_1_weekly_reduction
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: NZD
    source: Social Security Act 2018 Schedule 2 definition of Income Test 1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/schedule/2/definition/income-test-1
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          (
              min(
                  max(
                      0,
                      max(0, main_benefit_income_test_assessable_income)
                      - main_benefit_income_test_lower_weekly_threshold
                  ),
                  max(
                      0,
                      main_benefit_income_test_upper_weekly_threshold
                      - main_benefit_income_test_lower_weekly_threshold
                  )
              )
              * main_benefit_income_test_1_lower_abatement_rate
          ) + (
              max(
                  0,
                  max(0, main_benefit_income_test_assessable_income)
                  - main_benefit_income_test_upper_weekly_threshold
              )
              * main_benefit_income_test_1_upper_abatement_rate
          )
