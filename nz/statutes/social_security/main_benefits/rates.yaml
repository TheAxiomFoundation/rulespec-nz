          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/schedule/2/definition/income-test-4
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if jobseeker_support_single:
              if jobseeker_support_dependent_children_count >= 1:
                  (
                      min(
                          max(
                              0,
                              jobseeker_support_total_income
                              - main_benefit_income_test_lower_weekly_threshold
                          ),
                          max(
                              0,
                                  main_benefit_income_test_upper_weekly_threshold
                                  - main_benefit_income_test_lower_weekly_threshold
                          )
                      )
                      * main_benefit_income_test_1_lower_abatement_rate
                  ) + (
                      max(
                          0,
                          jobseeker_support_total_income
                          - main_benefit_income_test_upper_weekly_threshold
                      )
                      * main_benefit_income_test_1_upper_abatement_rate
                  )
              else:
                  if jobseeker_support_transferred_2013_no_dependent_children:
                      (
                          min(
                              max(
                                  0,
                                  jobseeker_support_total_income
                                  - main_benefit_income_test_lower_weekly_threshold
                              ),
                              max(
                                  0,
                                      main_benefit_income_test_upper_weekly_threshold
                                      - main_benefit_income_test_lower_weekly_threshold
                              )
                          )
                          * main_benefit_income_test_1_lower_abatement_rate
                      ) + (
                          max(
                              0,
                              jobseeker_support_total_income
                              - main_benefit_income_test_upper_weekly_threshold
                          )
                          * main_benefit_income_test_1_upper_abatement_rate
                      )
                  else:
                      (
                          max(
                              0,
                              jobseeker_support_total_income
                              - main_benefit_income_test_lower_weekly_threshold
                          )
                          * main_benefit_income_test_3_abatement_rate
                      )
          else:
              if (
                  jobseeker_support_partner_ineligible_due_to_sanction_or_strike
                  or jobseeker_support_partner_receives_main_benefit
                  or jobseeker_support_partner_receives_new_zealand_superannuation_or_veterans_pension
              ):
                  (
                      max(
                          0,
                          jobseeker_support_total_income
                          - main_benefit_income_test_lower_weekly_threshold
                      )
                      * main_benefit_income_test_4_abatement_rate
                  )
              else:
                  (
                      max(
                          0,
                          jobseeker_support_total_income
                          - main_benefit_income_test_lower_weekly_threshold
                      )
                      * main_benefit_income_test_3_abatement_rate
                  )
