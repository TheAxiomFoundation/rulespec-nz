  - name: jobseeker_support_gross_weekly_rate
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: NZD
    source: Social Security Act 2018 Schedule 4 Part 1 clauses 1 and 3
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/schedule/4/part/1/clause/lms118447
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if jobseeker_support_single:
              if jobseeker_support_dependent_children_count >= 1:
                  if (
                      jobseeker_support_youngest_dependent_child_age
                      >= jobseeker_support_youngest_child_14_or_older_age_threshold
                  ):
                      jobseeker_support_single_youngest_child_14_or_older_weekly_rate
                  else:
                      jobseeker_support_single_with_dependent_children_weekly_rate
              else:
                  if (
                      jobseeker_support_applicant_age
                      < jobseeker_support_under_20_living_with_parent_age_limit
                      and jobseeker_support_living_with_parent
                      and jobseeker_support_benefit_commenced_on_or_after_1998_07_01
                  ):
                      jobseeker_support_single_under_20_living_with_parent_weekly_rate
                  else:
                      if (
                          jobseeker_support_applicant_age
                          < jobseeker_support_under_25_without_children_age_limit
                      ):
                          jobseeker_support_single_under_25_without_children_weekly_rate
                      else:
                          if jobseeker_support_transferred_2013_no_dependent_children:
                              jobseeker_support_single_no_children_transferred_2013_weekly_rate
                          else:
                              jobseeker_support_single_no_children_standard_weekly_rate
          else:
              if jobseeker_support_partner_ineligible_due_to_sanction_or_strike:
                  if jobseeker_support_dependent_children_count >= 1:
                      jobseeker_support_partner_ineligible_with_children_special_weekly_rate
                  else:
                      jobseeker_support_partner_ineligible_without_children_special_weekly_rate
              else:
                  if jobseeker_support_partner_receives_main_benefit:
                      if jobseeker_support_dependent_children_count >= 1:
                          jobseeker_support_partnered_both_main_benefits_with_children_weekly_rate
                      else:
                          jobseeker_support_partnered_both_main_benefits_without_children_weekly_rate
                  else:
                      if jobseeker_support_partner_receives_new_zealand_superannuation_or_veterans_pension:
                          if jobseeker_support_dependent_children_count >= 1:
                              jobseeker_support_partnered_with_super_or_veterans_with_children_weekly_rate
                          else:
                              jobseeker_support_partnered_with_super_or_veterans_without_children_weekly_rate
                      else:
                          if jobseeker_support_dependent_children_count >= 1:
                              jobseeker_support_partnered_partner_without_own_benefit_with_children_weekly_rate
                          else:
                              jobseeker_support_partnered_partner_without_own_benefit_without_children_weekly_rate
