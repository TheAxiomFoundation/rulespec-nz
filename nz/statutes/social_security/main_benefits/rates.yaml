  - name: supported_living_payment_schedule_weekly_rate_before_residential_care_halving
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: NZD
    source: Social Security Act 2018 Schedule 4 Part 3 clauses 1 and 7
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/schedule/4/part/3/clause/lms118466
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if supported_living_payment_single:
              if supported_living_payment_dependent_children_count >= 1:
                  supported_living_payment_single_with_children_weekly_rate
              else:
                  if (
                      supported_living_payment_applicant_age
                      < supported_living_payment_single_under_18_age_limit
                  ):
                      supported_living_payment_single_under_18_without_children_weekly_rate
                  else:
                      supported_living_payment_single_adult_without_children_weekly_rate
          else:
              if supported_living_payment_partner_receives_main_benefit:
                  if supported_living_payment_dependent_children_count >= 1:
                      supported_living_payment_partnered_both_main_benefits_with_children_weekly_rate
                  else:
                      supported_living_payment_partnered_both_main_benefits_without_children_weekly_rate
              else:
                  if supported_living_payment_partner_receives_new_zealand_superannuation_or_veterans_pension:
                      if supported_living_payment_dependent_children_count >= 1:
                          supported_living_payment_partnered_with_super_or_veterans_with_children_weekly_rate
                      else:
                          supported_living_payment_partnered_with_super_or_veterans_without_children_weekly_rate
                  else:
                      if supported_living_payment_restricted_or_blind:
                          if supported_living_payment_dependent_children_count >= 1:
                              supported_living_payment_restricted_or_blind_partner_without_own_benefit_with_children_weekly_rate
                          else:
                              supported_living_payment_restricted_or_blind_partner_without_own_benefit_without_children_weekly_rate
                      else:
                          if supported_living_payment_caring:
                              if supported_living_payment_dependent_children_count >= 1:
                                  supported_living_payment_caring_partner_without_own_benefit_with_children_weekly_rate
                              else:
                                  supported_living_payment_caring_partner_without_own_benefit_without_children_weekly_rate
                          else:
                              0
