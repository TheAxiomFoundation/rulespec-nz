format: rulespec/v1
module:
  summary: |-
    Social Security Act 2018 Schedule 2 defines the income-test reductions
    used by main benefits, and Schedule 4 sets the weekly rates for Jobseeker
    Support, Sole Parent Support, and Supported Living Payment. This module
    encodes those 2026 weekly rate schedules, benefit-specific income-test
    reductions, and the Supported Living Payment blind earnings subsidy.
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: nz/statute/act/public/2018/0032/schedule/4/part/1/clause/lms118447
units:
  - name: NZD
    kind: currency
    minor_units: 2
