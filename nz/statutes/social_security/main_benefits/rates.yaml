              if supported_living_payment_totally_blind:
                  max(0, supported_living_payment_beneficiary_personal_earnings)
              else:
                  min(
                      max(0, supported_living_payment_restricted_or_blind_earned_income_disregard_maximum),
                      max(0, supported_living_payment_beneficiary_personal_earnings)
                  )
