        formula: |-
          (
              (
                  not jobseeker_full_time_student
                  or jobseeker_section_25_discretionary_student_eligibility
              )
              and not jobseeker_unemployed_due_to_strike
              and not jobseeker_unemployed_or_on_leave_for_employment_related_training
          )
  - name: entitled_to_jobseeker_support
    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
