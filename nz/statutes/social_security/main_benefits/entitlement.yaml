        formula: |-
          (
              jobseeker_work_gap
              and jobseeker_available_for_work
              and jobseeker_age_requirement
              and social_security_residential_requirement
              and jobseeker_no_or_minimum_income_requirement
              and social_security_lawful_presence_requirement
              and main_benefit_concurrent_benefit_limit
              and jobseeker_not_ineligible
