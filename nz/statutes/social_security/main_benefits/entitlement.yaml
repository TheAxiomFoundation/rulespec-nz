format: rulespec/v1
module:
  summary: |-
    Social Security Act 2018 Part 2 sets common entitlement limits and the
    core entitlement requirements for main benefits. This module encodes the
    common residential, immigration-status, and concurrent-benefit limits, plus
    the executable entitlement predicates for Jobseeker Support, Sole Parent
    Support, and Supported Living Payment. Administrative medical certificates,
    MSD satisfaction, and other external determinations remain factual inputs.
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: nz/statute/act/public/2018/0032/section/16
rules:
