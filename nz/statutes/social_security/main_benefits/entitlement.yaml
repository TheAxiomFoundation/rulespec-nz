  - name: supported_living_restricted_work_capacity_permanent
    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
    source: Social Security Act 2018 s 35(2)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/section/35
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          (
              supported_living_restricting_condition_expected_to_continue_required_period
              or supported_living_terminal_condition
