  - name: sole_parent_requirement
    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
    source: Social Security Act 2018 s 30
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/section/30
    versions:
