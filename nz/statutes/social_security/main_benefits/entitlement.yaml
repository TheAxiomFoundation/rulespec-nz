        formula: |-
          supported_living_applicant_age >= supported_living_restricted_or_blind_minimum_age
  - name: supported_living_restricted_or_blind_not_ineligible
    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
    source: Social Security Act 2018 s 36
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/section/36
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          not supported_living_restricted_capacity_or_blindness_self_inflicted_to_qualify
  - name: entitled_to_supported_living_payment_restricted_or_blind
    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
    source: Social Security Act 2018 s 34
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/section/34
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          (
              supported_living_restricted_or_blind_requirement
              and social_security_residential_requirement
              and supported_living_restricted_or_blind_age_requirement
              and social_security_lawful_presence_requirement
              and main_benefit_concurrent_benefit_limit
              and supported_living_restricted_or_blind_not_ineligible
          )
  - name: supported_living_open_employment_trial_preserves_entitlement
    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
    source: Social Security Act 2018 s 39
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/section/39
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          (
              supported_living_payment_granted_for_restricted_work_capacity
              and supported_living_open_employment_trial_agreed_with_msd
              and supported_living_open_employment_trial_weeks <= supported_living_open_employment_trial_maximum_weeks
          )
  - name: supported_living_caring_full_time_care_requirement
    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
    source: Social Security Act 2018 s 40(1)(a) and (2)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/section/40
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          (
              (
                  supported_living_caring_required_full_time_care_at_home
                  and supported_living_cared_person_would_otherwise_receive_institutional_care
                  and not supported_living_cared_person_is_spouse_or_partner
              )
              or (
                  supported_living_caring_payment_already_granted
                  and supported_living_caring_temporary_continuation_days > 0
                  and supported_living_caring_temporary_continuation_days <= supported_living_caring_temporary_continuation_maximum_days
              )
          )
  - name: supported_living_caring_age_requirement
    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
    source: Social Security Act 2018 s 40(1)(c)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/section/40
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          (
              (
                  not supported_living_caring_applicant_has_dependent_child
                  and supported_living_caring_applicant_age >= supported_living_caring_minimum_age_without_dependent_child
              )
              or (
