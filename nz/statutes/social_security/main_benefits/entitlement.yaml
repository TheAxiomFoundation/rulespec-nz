        formula: |-
          (
              jobseeker_has_no_income
              or jobseeker_income_less_than_zero_rate_cutout
              or jobseeker_temporary_income_reduces_rate_to_zero_but_otherwise_entitled
          )
  - name: jobseeker_not_ineligible
    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
    source: Social Security Act 2018 ss 25 and 26
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/section/25
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/section/26
    versions:
