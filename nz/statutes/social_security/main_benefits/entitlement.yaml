        formula: |-
          sole_parent_applicant_age >= sole_parent_minimum_age
  - name: entitled_to_sole_parent_support
    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
    source: Social Security Act 2018 s 29
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/section/29
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          (
              sole_parent_requirement
              and sole_parent_split_care_requirement
              and social_security_residential_requirement
              and sole_parent_age_requirement
              and social_security_lawful_presence_requirement
              and main_benefit_concurrent_benefit_limit
          )
  - name: sole_parent_support_expires_when_youngest_child_turns_age_limit
    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
    source: Social Security Act 2018 s 33
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/section/33
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          (
              sole_parent_receiving_sole_parent_support
              and sole_parent_youngest_dependent_child_age >= sole_parent_dependent_child_age_limit
