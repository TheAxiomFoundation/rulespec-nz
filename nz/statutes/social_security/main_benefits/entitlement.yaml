  - name: supported_living_restricted_work_capacity_severe
    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
    source: Social Security Act 2018 s 35(3)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/section/35
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          supported_living_regular_open_employment_capacity_hours_per_week < supported_living_severe_restriction_hours_per_week
  - name: supported_living_restricted_work_capacity
    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
    source: Social Security Act 2018 s 35
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/section/35
    versions:
      - effective_from: '2026-04-01'
