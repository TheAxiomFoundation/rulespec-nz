              sole_parent_is_single
              or sole_parent_spouse_or_partner_died
              or sole_parent_marriage_or_civil_union_dissolved
              or sole_parent_living_apart_and_lost_or_lacks_partner_support
              or sole_parent_lost_regular_support_due_to_partner_sentence_conditions
          )
  - name: sole_parent_child_requirement
    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
    source: Social Security Act 2018 ss 30 and 31
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
