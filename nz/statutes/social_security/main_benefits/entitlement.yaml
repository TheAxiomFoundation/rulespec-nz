          (
              supported_living_capacity_restricted_by_health_condition_injury_or_disability
              and supported_living_restricted_work_capacity_permanent
              and supported_living_restricted_work_capacity_severe
          )
  - name: supported_living_restricted_or_blind_requirement
    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
    source: Social Security Act 2018 s 34(a)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/section/34
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          supported_living_restricted_work_capacity or supported_living_totally_blind
  - name: supported_living_restricted_or_blind_age_requirement
    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
    source: Social Security Act 2018 s 34(c)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/section/34
    versions:
