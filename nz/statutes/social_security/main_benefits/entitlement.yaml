  - name: social_security_residential_requirement
    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
    source: Social Security Act 2018 s 16
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/section/16
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          (
              (
                  (
                      social_security_new_zealand_citizen
                      or social_security_residence_class_visa_holder
                  )
                  and social_security_ordinarily_resident_in_new_zealand_on_application
                  and (
                      social_security_continuous_residence_years_after_citizen_or_resident >= social_security_residence_years_required
                      or social_security_refugee_or_protected_person
                  )
              )
              or (
                  social_security_ordinarily_resident_in_reciprocity_country
                  and social_security_continuous_residence_years_before_application >= social_security_residence_years_required
              )
              or social_security_regulations_treat_person_as_meeting_residence_requirement
          )
  - name: social_security_lawful_presence_requirement
    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
    source: Social Security Act 2018 s 19
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/section/19
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          (
              (
                  not social_security_unlawfully_resident_or_present_in_new_zealand
                  and not social_security_only_temporary_entry_class_visa_holder
              )
              or social_security_section_205_override_applies
          )
  - name: main_benefit_concurrent_benefit_limit
    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
    source: Social Security Act 2018 s 18
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/section/18
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          (
              not main_benefit_receiving_another_main_benefit
              and not main_benefit_receiving_new_zealand_superannuation
              and not main_benefit_receiving_veterans_pension
          )
  - name: main_benefit_common_entitlement_requirements
    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
    source: Social Security Act 2018 ss 16, 18, and 19
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/section/16
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/section/18
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/section/19
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          (
              social_security_residential_requirement
              and social_security_lawful_presence_requirement
              and main_benefit_concurrent_benefit_limit
          )
  - name: jobseeker_work_gap
    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
    source: Social Security Act 2018 s 21
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/section/21
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          (
              not jobseeker_in_full_time_employment
              or jobseeker_losing_earnings_through_health_condition_or_injury
          )
  - name: jobseeker_available_for_work
    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
    source: Social Security Act 2018 s 22
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/section/22
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          (
              (
                  jobseeker_available_for_and_seeking_full_time_employment
                  and jobseeker_willing_and_able_to_undertake_full_time_employment
                  and jobseeker_taken_reasonable_steps_to_find_full_time_employment
              )
              or jobseeker_would_satisfy_available_for_work_but_for_work_test_exemption_circumstances
              or (
                  jobseeker_willing_and_able_to_undertake_full_time_employment
                  and jobseeker_health_condition_injury_or_disability_limits_capacity_to_seek_or_undertake_work
              )
          )
  - name: jobseeker_age_requirement
    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
    source: Social Security Act 2018 s 23
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2018/0032/section/23
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          (
              (
                  not jobseeker_has_dependent_child
                  and jobseeker_applicant_age >= jobseeker_minimum_age_without_dependent_child
              )
              or (
                  jobseeker_has_dependent_child
                  and jobseeker_applicant_age >= jobseeker_minimum_age_with_dependent_child
              )
          )
  - name: jobseeker_no_or_minimum_income_requirement
