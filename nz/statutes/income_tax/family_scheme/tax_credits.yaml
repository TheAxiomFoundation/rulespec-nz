format: rulespec/v1
module:
  summary: |-
    Income Tax Act 2007 Part M sets the core Working for Families tax-credit
    calculations. Sections MD 1 to MD 3 calculate the abating WFF credit,
    including family tax credit, in-work or child tax credit, and parental tax
    credit ordering, section MD 10 calculates the in-work tax credit, section
    MD 13 calculates family-credit abatement, section ME 1 calculates the
    minimum family tax credit, section ME 3 defines net family scheme income for
    that credit, and sections MG 1 to MG 3 calculate Best Start and its separate
    abatement. Section MA 4 floors negative tax-credit components at zero.
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: nz/statute/act/public/2007/0097/section/md-3
units:
  - name: NZD
    kind: currency
    minor_units: 2
