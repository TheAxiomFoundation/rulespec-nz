format: rulespec/v1
module:
  summary: |-
    Shared income-interface helpers for downstream NZ income-tax, family
    support, welfare, and ACC surfaces. This module centralises the period
    conversion primitives that are repeatedly used by annualised benefit and
    tax-credit calculations: days in a tax year, weeks in a tax year, and the
    safe annualisation of period amounts over day- or week-based entitlement
    windows.
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: nz/statute/act/public/2007/0097/section/bc-2
units:
  - name: NZD
    kind: currency
    minor_units: 2
rules:
  - name: income_tax_days_in_year
    kind: parameter
    dtype: Count
    source: Income Tax Act 2007 ss BC 2, MD 3, ME 3, MG 2, and MG 3
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: nz/statute/act/public/2007/0097/section/bc-2
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: nz/statute/act/public/2007/0097/section/md-3
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: nz/statute/act/public/2007/0097/section/me-3
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: nz/statute/act/public/2007/0097/section/mg-2
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: nz/statute/act/public/2007/0097/section/mg-3
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          365
  - name: income_tax_weeks_in_year
    kind: parameter
    dtype: Count
    source: Income Tax Act 2007 ss MD 10 and ME 1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: nz/statute/act/public/2007/0097/section/md-10
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: nz/statute/act/public/2007/0097/section/me-1
    versions:
      - effective_from: '2026-04-01'
        formula: |-
