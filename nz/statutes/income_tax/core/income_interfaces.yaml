      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2007/0097/section/bc-2
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2007/0097/section/md-3
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2007/0097/section/me-3
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2007/0097/section/mg-2
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2007/0097/section/mg-3
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if income_tax_period_days > 0:
              (
                  income_tax_period_amount
                  * income_tax_days_in_year
                  / income_tax_period_days
              )
          else:
              0
