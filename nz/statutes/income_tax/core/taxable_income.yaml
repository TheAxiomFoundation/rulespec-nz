format: rulespec/v1
module:
  summary: |-
    Income Tax Act 2007 Part B sets the core income-tax calculation spine:
    annual gross income, annual total deduction, net income or net loss,
    taxable income after available tax losses, income tax liability, and
    satisfaction of that liability by credits. Part C and section BD 1 identify
    income and assessable income. Part D sections DA 1 to DA 4 provide the
    general permission, general limitations, and interaction with specific
    deduction rules.
  source_verification:
    corpus_citation_paths:
      - nz/statute/act/public/2007/0097/section/BB-1
      - nz/statute/act/public/2007/0097/section/BC-1
      - nz/statute/act/public/2007/0097/section/BC-2
      - nz/statute/act/public/2007/0097/section/BC-3
      - nz/statute/act/public/2007/0097/section/BC-4
      - nz/statute/act/public/2007/0097/section/BC-5
      - nz/statute/act/public/2007/0097/section/BC-6
      - nz/statute/act/public/2007/0097/section/BC-7
      - nz/statute/act/public/2007/0097/section/BC-8
      - nz/statute/act/public/2007/0097/section/BD-1
      - nz/statute/act/public/2007/0097/section/BD-2
      - nz/statute/act/public/2007/0097/section/CA-1
      - nz/statute/act/public/2007/0097/section/CA-2
      - nz/statute/act/public/2007/0097/section/DA-1
      - nz/statute/act/public/2007/0097/section/DA-2
      - nz/statute/act/public/2007/0097/section/DA-3
      - nz/statute/act/public/2007/0097/section/DA-4
units:
  - name: NZD
    kind: currency
    minor_units: 2
rules:
  - name: income_tax_amount_is_income
    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
    source: Income Tax Act 2007 s CA 1
    versions:
      - effective_from: '2025-04-01'
        formula: |-
          (
              income_tax_amount_is_income_under_part_c_specific_provision
              or income_tax_amount_is_income_under_ordinary_concepts
          )
  - name: income_tax_amount_is_assessable_income
    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
    source: Income Tax Act 2007 ss BD 1 and CA 2
    versions:
      - effective_from: '2025-04-01'
        formula: |-
          (
              income_tax_amount_is_income
              and not income_tax_amount_is_exempt_income
              and not income_tax_amount_is_excluded_income
              and not income_tax_amount_is_non_residents_foreign_sourced_income
          )
  - name: income_tax_annual_gross_income
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: NZD
    source: Income Tax Act 2007 ss BC 2 and BD 1
    versions:
      - effective_from: '2025-04-01'
        formula: |-
          max(
              0,
              income_tax_total_income_allocated_to_corresponding_income_year
              - max(0, income_tax_exempt_income_allocated_to_corresponding_income_year)
              - max(0, income_tax_excluded_income_allocated_to_corresponding_income_year)
              - max(0, income_tax_non_residents_foreign_sourced_income_allocated_to_corresponding_income_year)
          )
  - name: income_tax_general_limitation_applies
    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
    source: Income Tax Act 2007 s DA 2
    versions:
      - effective_from: '2025-04-01'
        formula: |-
          (
              income_tax_expenditure_or_loss_is_capital_nature
              or income_tax_expenditure_or_loss_is_private_or_domestic
              or income_tax_expenditure_or_loss_incurred_deriving_exempt_income
              or income_tax_expenditure_or_loss_incurred_deriving_employment_income
              or income_tax_expenditure_or_loss_incurred_deriving_non_resident_passive_income
              or income_tax_expenditure_or_loss_incurred_deriving_non_residents_foreign_sourced_income
          )
  - name: income_tax_general_permission_applies
    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
    source: Income Tax Act 2007 ss DA 1 to DA 3
    versions:
      - effective_from: '2025-04-01'
        formula: |-
          (
              (
                  income_tax_expenditure_or_loss_incurred_deriving_assessable_income
                  or income_tax_expenditure_or_loss_incurred_deriving_excluded_income
                  or income_tax_expenditure_or_loss_incurred_deriving_assessable_and_excluded_income
                  or income_tax_business_expenditure_or_loss_for_deriving_assessable_income
                  or income_tax_business_expenditure_or_loss_for_deriving_excluded_income
                  or income_tax_business_expenditure_or_loss_for_deriving_assessable_and_excluded_income
                  or income_tax_specific_rule_supplements_general_permission
              )
              and not income_tax_general_limitation_applies
          )
  - name: income_tax_general_permission_deduction
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: NZD
    source: Income Tax Act 2007 ss BD 2, DA 1, DA 2, and DA 3
    versions:
      - effective_from: '2025-04-01'
        formula: |-
          if income_tax_general_permission_applies:
              max(0, income_tax_expenditure_or_loss_amount)
          else:
              0
  - name: income_tax_annual_total_deduction
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: NZD
    source: Income Tax Act 2007 ss BC 3 and BD 2
    versions:
      - effective_from: '2025-04-01'
        formula: |-
          max(0, income_tax_deductions_allocated_to_corresponding_income_year)
  - name: income_tax_net_income
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: NZD
    source: Income Tax Act 2007 s BC 4(1) and (2)
    versions:
      - effective_from: '2025-04-01'
        formula: |-
          max(0, income_tax_annual_gross_income - income_tax_annual_total_deduction)
  - name: income_tax_net_loss
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: NZD
    source: Income Tax Act 2007 s BC 4(3) and (4)
    versions:
      - effective_from: '2025-04-01'
        formula: |-
          max(0, income_tax_annual_total_deduction - income_tax_annual_gross_income)
  - name: taxable_income
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: NZD
    source: Income Tax Act 2007 ss BB 1 and BC 5
    versions:
      - effective_from: '2025-04-01'
        formula: |-
          max(0, income_tax_net_income - max(0, income_tax_available_tax_loss))
  - name: income_tax_tax_loss_offset_applied
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: NZD
    source: Income Tax Act 2007 ss BC 4 and BC 5
    versions:
      - effective_from: '2025-04-01'
        formula: |-
          min(
              max(0, income_tax_net_income),
              max(0, income_tax_available_tax_loss)
          )
  - name: income_tax_unused_tax_loss_carry_forward
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: NZD
    source: Income Tax Act 2007 ss BC 4 and BC 5
    versions:
      - effective_from: '2025-04-01'
        formula: |-
          max(
              0,
              max(0, income_tax_available_tax_loss)
              - max(0, income_tax_net_income)
          )
  - name: income_tax_activity_income_included
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: NZD
    source: Income Tax Act 2007 s MB 3; shared income-interface bridge for business and self-employment activity income
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          max(0, income_tax_activity_income - income_tax_activity_deductions)
  - name: income_tax_employment_income_included
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: NZD
    source: Income Tax Act 2007 s CE 1; shared income-interface bridge for employment, salary, and wage income
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          max(0, income_tax_employment_income - income_tax_employment_deductions)
  - name: income_tax_schedular_income_included
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: NZD
    source: Income Tax Act 2007 ss RE 1 to RE 4; shared income-interface bridge for schedular income inclusion
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          max(0, income_tax_schedular_income - income_tax_schedular_income_deductions)
  - name: income_tax_shared_income_bridge_total
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: NZD
    source: Income Tax Act 2007 shared income bridge; aggregation of employment, activity, and schedular income components
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          (
              income_tax_employment_income_included
              + income_tax_activity_income_included
              + income_tax_schedular_income_included
          )
  - name: income_tax_non_filing_taxpayer_liability
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: NZD
    source: Income Tax Act 2007 s BC 1(1)
    versions:
      - effective_from: '2025-04-01'
        formula: |-
          max(0, income_tax_total_tax_withheld_from_annual_gross_income)
  - name: income_tax_filing_taxpayer_liability_before_credits
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: NZD
    source: Income Tax Act 2007 ss BC 6 and BC 7
    versions:
      - effective_from: '2025-04-01'
        formula: |-
          if income_tax_person_has_schedular_income:
              max(
                  0,
                  income_tax_schedular_income_tax_liability
                  + income_tax_liability_if_person_had_no_schedular_income
              )
          else:
              max(0, income_tax_basic_tax_liability_on_taxable_income)
  - name: income_tax_terminal_tax
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: NZD
    source: Income Tax Act 2007 s BC 8(1) to (3)
    versions:
      - effective_from: '2025-04-01'
        formula: |-
          max(
              0,
              income_tax_liability_before_credits
              - max(0, income_tax_credits_available_to_satisfy_liability)
          )
  - name: income_tax_remaining_credits_after_liability
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: NZD
    source: Income Tax Act 2007 s BC 8(1) and (4)
    versions:
      - effective_from: '2025-04-01'
        formula: |-
          max(
              0,
              income_tax_credits_available_to_satisfy_liability
              - max(0, income_tax_liability_before_credits)
          )
