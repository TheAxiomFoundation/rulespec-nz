- name: annualized_amount_over_days_preserves_full_year_amount
  period:
    period_kind: tax_year
    start: '2026-04-01'
    end: '2027-03-31'
  input:
    nz:statutes/income_tax/core/income_interfaces#input.income_tax_period_amount: 3650
    nz:statutes/income_tax/core/income_interfaces#input.income_tax_period_days: 365
  output:
    nz:statutes/income_tax/core/income_interfaces#income_tax_days_in_year: 365
    nz:statutes/income_tax/core/income_interfaces#income_tax_annualized_amount_over_days: 3650

- name: annualized_amount_over_days_scales_partial_period
  period:
    period_kind: tax_year
