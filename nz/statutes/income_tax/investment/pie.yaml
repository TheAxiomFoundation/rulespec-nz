format: rulespec/v1
module:
  summary: |-
    Income Tax Act 2007 subpart HM (PIE provisions) and Inland Revenue
    prescribed investor rate (PIR) guidance define the tax on portfolio
    investment entity (PIE) income. The PIR depends on the investor's taxable
    income from the two preceding tax years (two-year lookback) and their
    PIE income type (savings, withdrawal, etc.). Current PIR rates are 10.5%,
    17.5%, and 28%.
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: nz/statute/act/public/2007/0097/section/hm-6
units:
  - name: NZD
    kind: currency
    minor_units: 2
rules:
  - name: pie_rate_10_5
    kind: parameter
    dtype: Rate
    source: Income Tax Act 2007 schedule 1 part B; IRD PIR guidance
