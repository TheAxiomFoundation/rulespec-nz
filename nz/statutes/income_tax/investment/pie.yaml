  - name: pie_determined_pir_rate
    kind: derived
    entity: Person
    dtype: Rate
    source: Income Tax Act 2007 schedule 6 table 1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2007/0097/schedule/6/clause/1
              excerpt: 'The prescribed investor rate for a person who is an investor in a multi-rate PIE is set out in table 1.'
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: nz/statute/act/public/2007/0097/schedule/6/clause/1
              excerpt: 'in either of the 2 income years before the relevant tax year, derives— a $15,600 or less in taxable income; and b $53,500 or less in the sum of their taxable income and attributed PIE income after subtracting any attributable PIE loss.'
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: nz/statute/act/public/2007/0097/schedule/6/clause/1
              excerpt: 'a $53,500 or less in taxable income; and b $78,100 or less in the sum of their taxable income and attributed PIE income after subtracting any attributable PIE loss'
    versions:
      - effective_from: '2020-04-01'
        formula: |-
          if pir_has_notified_pie_scheme_of_pir:
              pir_notified_rate
          else:
              if two_year_lookback_taxable_income <= pie_two_year_lookback_taxable_income_threshold_low and two_year_lookback_combined_pie_income <= pie_lookback_combined_income_threshold_low:
                  pie_rate_10_5
              elif two_year_lookback_taxable_income <= pie_two_year_lookback_taxable_income_threshold_high and two_year_lookback_combined_pie_income <= pie_lookback_combined_income_threshold_high:
                  pie_rate_17_5
              else:
                  pie_rate_28
  - name: pie_tax_on_income
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: NZD
    source: Income Tax Act 2007 subpart HM
    metadata:
