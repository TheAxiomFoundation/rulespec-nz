  - name: pie_determined_pir_rate
    kind: derived
    entity: Person
    dtype: Rate
    source: Income Tax Act 2007 section HM 6; IRD PIR determination rules
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2007/0097/section/hm-6
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/guidance/ird/pir-rates-kiwisaver-pie
    versions:
      - effective_from: '2020-04-01'
        formula: |-
          if pir_has_notified_pie_scheme_of_pir:
              pir_notified_rate
          else:
              if two_year_lookback_taxable_income < pie_two_year_lookback_taxable_income_threshold_low:
                  pie_rate_10_5
              elif two_year_lookback_taxable_income < pie_two_year_lookback_taxable_income_threshold_high:
                  pie_rate_17_5
              else:
                  pie_rate_28
  - name: pie_tax_on_income
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: NZD
    source: Income Tax Act 2007 subpart HM
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2007/0097/subpart/hm
    versions:
      - effective_from: '2020-04-01'
        formula: |-
          max(0, pie_taxable_income) * pie_determined_pir_rate