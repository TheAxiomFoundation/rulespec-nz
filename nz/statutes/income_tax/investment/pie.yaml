format: rulespec/v1
module:
  summary: |-
    Income Tax Act 2007 subpart HM and schedule 6 define the tax on portfolio
    investment entity (PIE) income. Schedule 6 table 1 sets the prescribed
    investor rate (PIR) for an investor in a multi-rate PIE: 10.5%, 17.5%, or
    28% for a New Zealand resident natural person, selected by a two-limb
    income test over either of the 2 income years before the relevant tax
    year.

    Both qualifying rows carry TWO limbs, and each must hold. Row 6 (10.5%)
    requires taxable income of $15,600 or less AND taxable income plus
    attributed PIE income, less any attributable PIE loss, of $53,500 or
    less. Row 4 (17.5%) requires taxable income of $53,500 or less AND the
    same combined measure of $78,100 or less. Anything else takes the 28%
    default in rows 1 to 3. The statute reads "or less", so the thresholds
    are inclusive bounds.

    Threshold versions follow Taxation (Budget Measures) Act 2024 s 39, which
    replaced $48,000 with $53,500 and $70,000 with $78,100 in row 4, and
    $14,000 with $15,600 and $48,000 with $53,500 in row 6, applying for the
    2025-26 and later income years.

    Out of scope by name: the zero rates and variable foreign-investor rates
    in rows 7B to 10, the trustee notification rows 3, 5, and 7, and the
    retirement scheme contribution rates in schedule 6 table 2.
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: nz/statute/act/public/2007/0097/schedule/6/clause/1
units:
  - name: NZD
    kind: currency
    minor_units: 2
