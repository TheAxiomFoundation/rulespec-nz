              corpus_citation_path: nz/statute/act/public/2024/0019/section/39
              excerpt: 'In schedule 6, table 1 , row 6, column 2, paragraph (a), replace $14,000 with $15,600 .'
          - path: versions[1].formula
            kind: parameter
            source:
