# Companion tests for the FamilyBoost tax credit (ITA 2007 subpart MH,
# post-1-July-2025 settings as consolidated in the bound corpus). The abatement
# is 7 cents per COMPLETE dollar of tax credit income above $35,000 (floored),
# with the $57,286 cutout stated directly by MH 5(3). Partner incomes combine
# under MH 4(7) unless separated (MH 4(8)). Expected values are hand-computed
# with exact decimals.
- name: income below the abatement threshold pays 40 percent of fees
  period:
    period_kind: custom
    name: tax_credit_quarter
    start: '2026-07-01'
    end: '2026-09-30'
  input:
    nz:statutes/income_tax/familyboost_tax_credit/core#input.claimant_is_natural_person: true
    nz:statutes/income_tax/familyboost_tax_credit/core#input.is_caregiver_of_child_enrolled_with_licensed_ece: true
    nz:statutes/income_tax/familyboost_tax_credit/core#input.incurs_licensed_ece_fees_for_enrolled_child: true
    nz:statutes/income_tax/familyboost_tax_credit/core#input.is_resident_in_nz: true
    nz:statutes/income_tax/familyboost_tax_credit/core#input.relationship_partner_is_couples_claimant_for_quarter: false
    nz:statutes/income_tax/familyboost_tax_credit/core#input.has_relationship_partner: false
    nz:statutes/income_tax/familyboost_tax_credit/core#input.separated_with_no_partner_at_quarter_end: false
    nz:statutes/income_tax/familyboost_tax_credit/core#input.licensed_ece_fees_payable_for_quarter: 3000.00
    nz:statutes/income_tax/familyboost_tax_credit/core#input.quarterly_reportable_income: 30000.00
    nz:statutes/income_tax/familyboost_tax_credit/core#input.annual_taxable_income_for_other_income_route: 0
    nz:statutes/income_tax/familyboost_tax_credit/core#input.has_reportable_income: true
    nz:statutes/income_tax/familyboost_tax_credit/core#input.has_other_income: false
    nz:statutes/income_tax/familyboost_tax_credit/core#input.has_filed_return_for_income_year_including_quarter: true
    nz:statutes/income_tax/familyboost_tax_credit/core#input.commissioner_may_use_most_recent_return: false
    nz:statutes/income_tax/familyboost_tax_credit/core#input.exempt_from_filing_two_years_and_no_reportable_income: false
    nz:statutes/income_tax/familyboost_tax_credit/core#input.partner_tax_credit_income_for_quarter: 0
  output:
    nz:statutes/income_tax/familyboost_tax_credit/core#fb_tax_credit_income: 30000.00
    nz:statutes/income_tax/familyboost_tax_credit/core#fb_pre_abatement_credit: 1200.00
    nz:statutes/income_tax/familyboost_tax_credit/core#fb_abatement_amount: 0
    nz:statutes/income_tax/familyboost_tax_credit/core#fb_entitled: holds
    nz:statutes/income_tax/familyboost_tax_credit/core#familyboost_tax_credit: 1200.00
