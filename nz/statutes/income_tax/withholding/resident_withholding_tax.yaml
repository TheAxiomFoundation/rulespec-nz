format: rulespec/v1
module:
  summary: |-
    Income Tax Act 2007 subpart RE (RWT provisions) and Inland Revenue RWT rate
    guidance define the resident withholding tax rates applied to interest and
    dividends for New Zealand residents. The applicable RWT rate depends on the
    recipient's prescribed tax rate (or notified rate) and whether they have
    provided a valid RWT exemption certificate.
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: nz/statute/act/public/2007/0097/section/re-2
units:
  - name: NZD
    kind: currency
    minor_units: 2
rules:
  - name: rwt_rate_10_5
    kind: parameter
    dtype: Rate
    source: Income Tax Act 2007 schedule 1 part B; IRD RWT rate guidance
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: nz/statute/act/public/2007/0097/schedule/1/part/b
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: nz/guidance/ird/rwt-rates
    versions:
      - effective_from: '2020-04-01'
        formula: |-
          0.105
  - name: rwt_rate_17_5
