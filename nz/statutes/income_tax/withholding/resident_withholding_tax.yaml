format: rulespec/v1
module:
  summary: |-
    Income Tax Act 2007 subpart RE (RWT provisions) and Inland Revenue RWT rate
    guidance define the resident withholding tax rates applied to interest and
    dividends for New Zealand residents. The applicable RWT rate depends on the
    recipient's prescribed tax rate (or notified rate) and whether they have
    provided a valid RWT exemption certificate.
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: nz/statute/act/public/2007/0097/section/re-2
units:
  - name: NZD
    kind: currency
    minor_units: 2
rules:
  - name: rwt_rate_10_5
    kind: parameter
    dtype: Rate
    source: Income Tax Act 2007 schedule 1 part D clause 3; IRD RWT rate guidance
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: nz/statute/act/public/2007/0097/schedule/1/part/d/clause/3
              excerpt: '| 0.105'
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: nz/guidance/ird/rwt-rates/block-5
              excerpt: Up to $15,600 10.5%
    versions:
      - effective_from: '2020-04-01'
        formula: |-
          0.105
  - name: rwt_rate_17_5
    kind: parameter
    dtype: Rate
    source: Income Tax Act 2007 schedule 1 part D clause 3; IRD RWT rate guidance
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: nz/statute/act/public/2007/0097/schedule/1/part/d/clause/3
              excerpt: '| 0.175'
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: nz/guidance/ird/rwt-rates/block-5
              excerpt: $15,601 to $53,500 17.5%
    versions:
      - effective_from: '2020-04-01'
        formula: |-
          0.175
  - name: rwt_rate_30
    kind: parameter
    dtype: Rate
    source: Income Tax Act 2007 schedule 1 part D clause 3; IRD RWT rate guidance
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: nz/statute/act/public/2007/0097/schedule/1/part/d/clause/3
              excerpt: '| 0.300'
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: nz/guidance/ird/rwt-rates/block-5
              excerpt: $53,501 to $78,100 30%
    versions:
      - effective_from: '2020-04-01'
        formula: |-
          0.30
  - name: rwt_rate_33
    kind: parameter
    dtype: Rate
    source: Income Tax Act 2007 schedule 1 part D clause 3; IRD RWT rate guidance
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: nz/statute/act/public/2007/0097/schedule/1/part/d/clause/3
              excerpt: '| 0.330'
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: nz/guidance/ird/rwt-rates/block-5
              excerpt: $78,101 to $180,000 33%
    versions:
      - effective_from: '2020-04-01'
        formula: |-
          0.33
  - name: rwt_rate_39
    kind: parameter
    dtype: Rate
    source: Income Tax Act 2007 schedule 1 part D clause 3; IRD RWT rate guidance
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: nz/statute/act/public/2007/0097/schedule/1/part/d/clause/3
              excerpt: '| 0.390'
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: nz/guidance/ird/rwt-rates/block-5
              excerpt: $180,001 and over 39%
    versions:
      - effective_from: '2024-04-01'
        formula: |-
          0.39
  - name: rwt_applicable_rate
    kind: derived
    entity: Person
    dtype: Rate
    source: Income Tax Act 2007 subpart RE; IRD RWT rate guidance
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2007/0097/schedule/1/part/d/clause/3
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/guidance/ird/rwt-rates/block-4
              excerpt: If you've given your interest payer your IRD number, you may use the 10.5%, 17.5%, 30%, 33% or 39% rate. This is the amount of tax to be deducted during the year. It should match your income tax rate.
    versions:
      - effective_from: '2024-04-01'
        formula: |-
          if rwt_holder_has_exemption_certificate:
              0
          elif rwt_holder_has_notified_rwt_rate:
              rwt_notified_rate
          elif rwt_holders_prescribed_tax_rate <= 0.105:
              rwt_rate_10_5
          elif rwt_holders_prescribed_tax_rate <= 0.175:
              rwt_rate_17_5
          elif rwt_holders_prescribed_tax_rate <= 0.30:
              rwt_rate_30
          elif rwt_holders_prescribed_tax_rate <= 0.33:
              rwt_rate_33
          else:
              rwt_rate_39
  - name: rwt_withholding_amount
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: NZD
    source: Income Tax Act 2007 subpart RE
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2007/0097/section/re-12
    versions:
      - effective_from: '2024-04-01'
        formula: |-
          max(0, rwt_gross_interest_and_dividends) * rwt_applicable_rate
