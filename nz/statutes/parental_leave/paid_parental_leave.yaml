format: rulespec/v1
module:
  summary: |-
    Parental Leave and Employment Protection Act 1987 Part 3 and Inland Revenue
    paid parental leave (PPL) rate guidance define the entitlement and payment
    rates for paid parental leave in New Zealand. The weekly PPL rate is the
    lower of the employee's average weekly earnings and the maximum PPL rate.
    Duration is up to 26 weeks.
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: nz/statute/act/public/1987/0129/section/71m
units:
  - name: NZD
    kind: currency
    minor_units: 2
rules:
  - name: ppl_entitlement_weeks
    kind: parameter
    dtype: Count
    source: Parental Leave and Employment Protection Act 1987 s 71A
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: nz/statute/act/public/1987/0129/section/71a
    versions:
      - effective_from: '2020-07-01'
        formula: |-
          26
  - name: ppl_maximum_weekly_rate
    kind: parameter
    dtype: Money
    unit: NZD
    source: >-
      Parental Leave and Employment Protection Act 1987 s 71B (annual
      adjustment by average ordinary time weekly earnings each 1 July); IRD
      paid parental leave rate guidance
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: nz/statute/act/public/1987/0129/section/71b
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: nz/guidance/employment-nz/parental-leave-payment-increase-2024
          - path: versions[1].formula
            kind: parameter
            source:
              corpus_citation_path: nz/statute/act/public/1987/0129/section/71b
          - path: versions[1].formula
            kind: parameter
            source:
              corpus_citation_path: nz/guidance/employment-nz/parental-leave-payment-increase-2026
          - path: versions[2].formula
            kind: parameter
            source:
              corpus_citation_path: nz/statute/act/public/1987/0129/section/71b
          - path: versions[2].formula
            kind: parameter
            source:
              corpus_citation_path: nz/guidance/employment-nz/parental-leave-payment-increase-2026
    versions:
      - effective_from: '2024-07-01'
        formula: |-
          754.87
      - effective_from: '2025-07-01'
        formula: |-
          788.66
      - effective_from: '2026-07-01'
        formula: |-
          811.05
  - name: ppl_entitlement_for_employee
    kind: derived
    entity: Person
    dtype: Money
    period: Week
    unit: NZD
    source: Parental Leave and Employment Protection Act 1987 s 71B
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/1987/0129/section/71b
    versions:
      - effective_from: '2025-07-01'
        formula: |-
          if ppl_employee_is_eligible:
              min(
                  max(0, ppl_employees_average_weekly_earnings),
                  ppl_maximum_weekly_rate
              )
          else:
              0
  - name: ppl_total_entitlement
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: NZD
    source: Parental Leave and Employment Protection Act 1987 s 71A, s 71B
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/1987/0129/section/71a
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/1987/0129/section/71b
    versions:
      - effective_from: '2025-07-01'
        formula: |-
          ppl_entitlement_for_employee * ppl_entitlement_weeks
  - name: ppl_employed_eligibility_months
    kind: parameter
    dtype: Count
    source: Parental Leave and Employment Protection Act 1987 s 71
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: nz/statute/act/public/1987/0129/section/71
    versions:
      - effective_from: '2020-07-01'
        formula: |-
          12
  - name: ppl_hours_per_week_minimum
    kind: parameter
    dtype: Count
    source: Parental Leave and Employment Protection Act 1987 s 71
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: nz/statute/act/public/1987/0129/section/71
    versions:
      - effective_from: '2020-07-01'
        formula: |-
          10
  - name: ppl_transfer_entitlement_available
    kind: derived
    entity: Person
    dtype: Judgment
    period: Week
    source: Parental Leave and Employment Protection Act 1987 s 71B; Parental Leave and Employment Protection Regulations 2016 reg 10; Employment New Zealand parental leave payments guidance
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/1987/0129/section/71b
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/regulation/regulation/public/2016/0068/regulation/10
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/guidance/employment-nz/parental-leave-payments
    versions:
      - effective_from: '2025-07-01'
        formula: |-
          (
              ppl_employee_is_eligible
              and ppl_transfer_requested
              and ppl_transfer_recipient_is_spouse_or_partner
              and ppl_transfer_recipient_is_primary_carer
              and not ppl_transfer_entitlement_already_transferred
          )
  - name: ppl_transferred_entitlement_weeks
    kind: derived
    entity: Person
    dtype: Count
    period: Week
    source: Parental Leave and Employment Protection Act 1987 s 71B; Parental Leave and Employment Protection Regulations 2016 reg 10; Employment New Zealand parental leave payments guidance
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/1987/0129/section/71b
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/regulation/regulation/public/2016/0068/regulation/10
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/guidance/employment-nz/parental-leave-payments
    versions:
      - effective_from: '2025-07-01'
        formula: |-
          if ppl_transfer_entitlement_available:
              min(
                  max(0, ppl_transfer_requested_weeks),
                  ppl_entitlement_weeks
              )
          else:
              0
  - name: ppl_transferred_weekly_rate
    kind: derived
    entity: Person
    dtype: Money
    period: Week
    unit: NZD
    source: Parental Leave and Employment Protection Act 1987 s 71B; Parental Leave and Employment Protection Regulations 2016 reg 10; Employment New Zealand parental leave payments guidance
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
