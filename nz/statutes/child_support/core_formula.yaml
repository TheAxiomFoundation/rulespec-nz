format: rulespec/v1
module:
  summary: |-
    Child Support Act 1991 and Inland Revenue child support formula guidance
    define the core child support formula parameters. The formula uses a living
    allowance, basic child support percentage, and multi-child allocation rules.
    NOTE: The full formula with shared care, multi-parent, and variation
    provisions requires comprehensive extraction beyond this core module.
    The nztaxmicrosim oracle child-support function is explicitly simplified
    and excluded as canonical authority.
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: nz/statute/act/public/1991/0142/section/35a
units:
  - name: NZD
    kind: currency
    minor_units: 2
rules:
  - name: cs_living_allowance_percentage
    kind: parameter
    dtype: Rate
    source: Child Support Act 1991 schedule 1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: nz/statute/act/public/1991/0142/schedule/1
    versions:
      - effective_from: '2020-04-01'
        formula: |-
          0.1845
  - name: cs_child_support_rate_standard
    kind: parameter
    dtype: Rate
    source: Child Support Act 1991 s 40; schedule 2
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: nz/statute/act/public/1991/0142/section/40
    versions:
      - effective_from: '2020-04-01'
        formula: |-
          0.18
  - name: cs_child_support_rate_one_child
    kind: parameter
    dtype: Rate
    source: Child Support Act 1991 schedule 2
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: nz/statute/act/public/1991/0142/schedule/2
    versions:
      - effective_from: '2020-04-01'
        formula: |-
          0.18
  - name: cs_child_support_rate_two_children
    kind: parameter
    dtype: Rate
    source: Child Support Act 1991 schedule 2
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: nz/statute/act/public/1991/0142/schedule/2
    versions:
      - effective_from: '2020-04-01'
        formula: |-
          0.26
  - name: cs_child_support_rate_three_or_more_children
    kind: parameter
    dtype: Rate
    source: Child Support Act 1991 schedule 2
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: nz/statute/act/public/1991/0142/schedule/2
    versions:
      - effective_from: '2020-04-01'
        formula: |-
          0.33
  - name: cs_maximum_child_support_annual_rate
    kind: parameter
    dtype: Money
    unit: NZD
    source: Child Support Act 1991 schedule 1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: nz/statute/act/public/1991/0142/schedule/1
          - path: versions[1].formula
            kind: parameter
            source:
              corpus_citation_path: nz/statute/act/public/1991/0142/schedule/1
          - path: versions[2].formula
            kind: parameter
            source:
              corpus_citation_path: nz/statute/act/public/1991/0142/schedule/1
    versions:
      - effective_from: '2025-04-01'
        formula: |-
          43217.04
      - effective_from: '2026-04-01'
        formula: |-
          44303.40
      - effective_from: '2027-04-01'
        formula: |-
          45303.60
  - name: cs_minimum_child_support_annual_rate
    kind: parameter
    dtype: Money
    unit: NZD
    source: Child Support Act 1991 schedule 1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: nz/statute/act/public/1991/0142/section/72
          - path: versions[1].formula
            kind: parameter
            source:
              corpus_citation_path: nz/statute/act/public/1991/0142/section/72
          - path: versions[2].formula
            kind: parameter
            source:
              corpus_citation_path: nz/statute/act/public/1991/0142/section/72
    versions:
      - effective_from: '2025-04-01'
        formula: |-
          1368.84
      - effective_from: '2026-04-01'
        formula: |-
          1402.56
      - effective_from: '2027-04-01'
        formula: |-
          1435.08
  - name: cs_child_support_income
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: NZD
    source: Child Support Act 1991 schedule 1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/1991/0142/schedule/1
    versions:
      - effective_from: '2020-04-01'
        formula: |-
          max(0, cs_liable_parents_taxable_income - (cs_liable_parents_taxable_income * cs_living_allowance_percentage))
  - name: cs_annual_child_support_entitlement
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: NZD
    source: Child Support Act 1991 schedule 2
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/1991/0142/schedule/2
    versions:
      - effective_from: '2020-04-01'
        formula: |-
            min(
                max(
                    cs_child_support_income * cs_applicable_child_support_rate,
                    cs_minimum_child_support_annual_rate
                ),
                cs_maximum_child_support_annual_rate
            )
  - name: cs_applicable_child_support_rate
    kind: derived
    entity: Person
    dtype: Rate
    period: Year
    source: Child Support Act 1991 schedule 2
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/1991/0142/schedule/2
    versions:
      - effective_from: '2020-04-01'
        formula: |-
          if cs_child_support_qualifying_children_count <= 1:
              cs_child_support_rate_one_child
          else:
              if cs_child_support_qualifying_children_count == 2:
                  cs_child_support_rate_two_children
              else:
                  cs_child_support_rate_three_or_more_children
  - name: cs_receiving_carer_meets_formula_care_threshold
    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
    source: Child Support Act 1991 s 5; IRD sharing care guidance
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/1991/0142/section/5
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/guidance/ird/child-support/types/formula-assessment/sharing-care
    versions:
      - effective_from: '2020-04-01'
        formula: |-
          cs_child_support_child_care_percent_with_receiving_carer >= 35
  - name: cs_liable_parent_is_formula_assessment_liable
    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
    source: Child Support Act 1991 ss 4, 5, and 8; IRD child support overview
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/1991/0142/section/4
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/1991/0142/section/5
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/1991/0142/section/8
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/guidance/ird/child-support/overview
    versions:
      - effective_from: '2020-04-01'
        formula: |-
          (
              cs_liable_parent_is_parent_of_child
              and cs_liable_parent_is_nz_resident_or_agreement_country
              and not cs_liable_parent_lives_with_receiving_carer
          )
  - name: cs_formula_assessment_applies
    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
    source: Child Support Act 1991 ss 4, 5, and 8; IRD child support overview
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/1991/0142/section/4
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/1991/0142/section/5
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/1991/0142/section/8
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/guidance/ird/child-support/overview
    versions:
      - effective_from: '2020-04-01'
        formula: |-
          (
              cs_receiving_carer_meets_formula_care_threshold
              and cs_liable_parent_is_formula_assessment_liable
          )
  - name: cs_annual_child_support_payable
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: NZD
    source: Child Support Act 1991 ss 4, 5, and 8; schedule 1; schedule 2
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/1991/0142/section/4
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/1991/0142/section/5
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/1991/0142/section/8
    versions:
      - effective_from: '2020-04-01'
        formula: |-
          if cs_formula_assessment_applies:
              cs_annual_child_support_entitlement
          else:
              0
