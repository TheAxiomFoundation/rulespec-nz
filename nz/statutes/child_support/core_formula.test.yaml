# Companion tests for the Child Support Act 1991 income-shares formula.
# Dollar inputs marked (IRD) are Inland Revenue published figures for the stated
# child support year, verified against
# https://www.ird.govt.nz/child-support/how-much-you-might-get-or-pay/rates
# All expected values are hand-computed with exact terminating decimals.
- name: standard formula assessment above the minimum (2025-26, 30% care)
  period: 2025-04
  input:
    nz:statutes/child_support/core_formula#input.care_proportion: 0.30
    nz:statutes/child_support/core_formula#input.adjusted_income: 74909
    nz:statutes/child_support/core_formula#input.living_allowance: 29909
    nz:statutes/child_support/core_formula#input.dependent_child_allowance: 0
    nz:statutes/child_support/core_formula#input.multi_group_allowance: 0
    nz:statutes/child_support/core_formula#input.other_parents_child_support_income_amount: 15000
    nz:statutes/child_support/core_formula#input.child_expenditure_table_amount: 10000
    nz:statutes/child_support/core_formula#input.number_of_children_in_child_support_group: 1
    nz:statutes/child_support/core_formula#input.total_annual_formula_amount: 5100
    nz:statutes/child_support/core_formula#input.minimum_annual_rate: 1175
  output:
    nz:statutes/child_support/core_formula#care_cost_percentage: 0.24
    nz:statutes/child_support/core_formula#child_support_income_amount: 45000
    nz:statutes/child_support/core_formula#income_percentage: 0.75
    nz:statutes/child_support/core_formula#child_expenditure_amount: 10000
    nz:statutes/child_support/core_formula#annual_amount_of_child_support: 5100
    nz:statutes/child_support/core_formula#assessed_annual_rate: 5100
