format: rulespec/v1
module:
  summary: |-
    Income Tax Act 2007 PAYE provisions and Inland Revenue payroll deduction
    tables define the aggregation of all deductions that employers must withhold
    from salary or wages. This module assembles the individual statutory
    deduction components (income tax, ACC earners levy, KiwiSaver, student loan)
    into a total PAYE deduction amount.
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: nz/statute/act/public/2007/0097/section/rd-3
units:
  - name: NZD
    kind: currency
    minor_units: 2
rules:
  - name: paye_income_tax_component
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: NZD
    source: Income Tax Act 2007 subpart RD; IRD PAYE tables
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2007/0097/section/rd-10
              excerpt: The amount of tax for a PAYE income payment that a person must withhold and pay to the Commissioner under section RA 5 (Tax obligations for employment-related taxes) is the relevant amount under schedule 2 (Basic tax rates for PAYE income payments).
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/guidance/ird/paye-deduction-tables/block-2
              excerpt: When you pay an employee their salary or wages, you need to make deductions for PAYE.
    versions:
      - effective_from: '2025-04-01'
        formula: |-
          paye_income_tax_on_taxable_portion_of_earnings
  - name: paye_acc_levy_component
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: NZD
    source: Accident Compensation (Earners' Levy) Regulations; IRD ACC levy rates
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/regulation/regulation/public/2025/0018/regulation/4
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/regulation/regulation/public/2025/0018/regulation/5
    versions:
      - effective_from: '2025-04-01'
        formula: |-
          acc_standard_earners_levy_including_gst
  - name: paye_kiwisaver_employee_component
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: NZD
    source: KiwiSaver Act 2006 s 64; IRD KiwiSaver deduction guidance
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2006/0040/section/64
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2006/0040/section/66
              excerpt: The employer must make deductions of contributions from each payment of the employee’s gross salary or wages of an amount equal to the contribution rate .
    versions:
      - effective_from: '2025-04-01'
        formula: |-
          kiwisaver_employee_deduction
  - name: paye_student_loan_component
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: NZD
    source: Student Loan Scheme Act 2011 s 22; IRD student loan deduction tables
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2011/0062/section/22
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/guidance/ird/student-loan-repayment-deductions/block-3
              excerpt: The amount you have to pay to your student loan each year is 12% of every dollar you earn over the repayment threshold.
    versions:
      - effective_from: '2025-04-01'
        formula: |-
          student_loan_annual_deduction
  - name: paye_total_deduction
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: NZD
    source: Income Tax Act 2007 subpart RD; IRD PAYE deduction tables
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/2007/0097/section/rd-10
              excerpt: The Commissioner may provide tables for the calculation of an amount of tax for a PAYE income payment that may incorporate other relevant information.
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/guidance/ird/paye-deduction-tables/block-2
              excerpt: |-
                When you pay an employee their salary or wages, you need to make deductions for PAYE.

                You may also need to make deductions for:

                child support

                student loan repayments

                KiwiSaver employee contributions

                KiwiSaver employer net contributions

                employer superannuation contribution tax (ESCT) .
    versions:
      - effective_from: '2025-04-01'
        formula: |-
          paye_income_tax_component
          + paye_acc_levy_component
          + paye_kiwisaver_employee_component
          + paye_student_loan_component
