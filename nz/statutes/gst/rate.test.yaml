    nz:statutes/gst/rate#gst_component_from_inclusive_amount: 0
    nz:statutes/gst/rate#gst_exclusive_amount_from_inclusive_amount: 0

- name: cents_scale_amounts
  period:
    period_kind: custom
    name: calendar_day
    start: '2026-06-16'
    end: '2026-06-16'
  input:
    nz:statutes/gst/rate#input.gst_exclusive_amount: 1
