format: rulespec/v1
module:
  summary: |-
    Goods and Services Tax Act 1985 sections 8 and 12 impose GST at
    15% on taxable supplies and imports, and section 10 states the
    GST-inclusive value mechanics for supplies. Inland Revenue's GST
    calculation guidance gives the current arithmetic for adding GST to
    GST-exclusive amounts and removing GST from GST-inclusive amounts.
    Low-value imported goods use the same GST rate together with the
    point-of-sale interface described in Inland Revenue guidance.
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: nz/statute/act/public/1985/0141/section/8
units:
  - name: NZD
    kind: currency
    minor_units: 2
rules:
  - name: gst_standard_rate
    kind: parameter
    dtype: Rate
    source: Goods and Services Tax Act 1985 ss 8(1) and 12(1)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: nz/statute/act/public/1985/0141/section/8
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: nz/statute/act/public/1985/0141/section/12
    versions:
      - effective_from: '2010-10-01'
        formula: |-
          0.15
  - name: gst_component_from_exclusive_amount
    kind: derived
    entity: Supply
    dtype: Money
    period: Day
    unit: NZD
    source: Goods and Services Tax Act 1985 s 8(1); Inland Revenue GST calculation guidance
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/1985/0141/section/8
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/guidance/ird/gst-calculation-guidance/block-7
              excerpt: The rate of GST is 15%, so they multiply the $100 price by 0.15 and get $15.
    versions:
      - effective_from: '2010-10-01'
        formula: gst_exclusive_amount * gst_standard_rate
  - name: gst_inclusive_amount_from_exclusive_amount
    kind: derived
    entity: Supply
    dtype: Money
    period: Day
    unit: NZD
    source: Goods and Services Tax Act 1985 s 8(1); Inland Revenue GST calculation guidance
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/1985/0141/section/8
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/guidance/ird/gst-calculation-guidance/block-7
              excerpt: Hine can add $15 to the original $100 price. The total price is $115 including GST.
    versions:
      - effective_from: '2010-10-01'
        formula: gst_exclusive_amount * (1 + gst_standard_rate)
  - name: gst_component_from_inclusive_amount
    kind: derived
    entity: Supply
    dtype: Money
    period: Day
    unit: NZD
    source: Inland Revenue GST calculation guidance
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/guidance/ird/gst-calculation-guidance/block-7
              excerpt: Arthur takes the total price with GST, $115, and multiplies it by 3. They divide that total by 23 and get $15. This is the GST part of the total price.
    versions:
      - effective_from: '2010-10-01'
        formula: |-
          gst_inclusive_amount
          * gst_standard_rate
          / (1 + gst_standard_rate)
  - name: gst_exclusive_amount_from_inclusive_amount
    kind: derived
    entity: Supply
    dtype: Money
    period: Day
    unit: NZD
    source: Goods and Services Tax Act 1985 s 10(2); Inland Revenue GST calculation guidance
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/1985/0141/section/10
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/guidance/ird/gst-calculation-guidance/block-7
              excerpt: Arthur takes away the GST amount, $15, from the total price, $115, and gets $100. The original price was $100 not including GST.
    versions:
      - effective_from: '2010-10-01'
        formula: |-
          gst_inclusive_amount
          / (1 + gst_standard_rate)
  - name: gst_low_value_imported_goods_threshold
    kind: parameter
    dtype: Money
    unit: NZD
    source: Goods and Services Tax Act 1985 s 12; IRD low-value imported goods guidance
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: nz/statute/act/public/1985/0141/section/12
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: nz/guidance/ird/gst-low-value-imported-goods/block-1
              excerpt: A low value good is a physical good valued at NZ$1,000 or less, excluding GST.
    versions:
      - effective_from: '2019-12-01'
        formula: |-
          1000
  - name: gst_low_value_imported_goods_subject_to_gst
    kind: derived
    entity: Import
    dtype: Judgment
    period: Day
    source: Goods and Services Tax Act 1985 s 12; IRD low-value imported goods guidance
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/1985/0141/section/12
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/guidance/ird/gst-low-value-imported-goods/block-1
              excerpt: From 1 December 2019, overseas businesses that sell low value goods to consumers in New Zealand may need to register for, collect and return GST.
    versions:
      - effective_from: '2019-12-01'
        formula: |-
          (
              gst_imported_goods_value <= gst_low_value_imported_goods_threshold
              and gst_imported_goods_outside_new_zealand_at_supply
              and gst_imported_goods_delivered_to_new_zealand_address
          )
  - name: gst_low_value_imported_goods_component
    kind: derived
    entity: Import
    dtype: Money
    period: Day
    unit: NZD
    source: Goods and Services Tax Act 1985 s 12; IRD low-value imported goods guidance
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/1985/0141/section/12
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/guidance/ird/gst-low-value-imported-goods/block-1
              excerpt: From 1 December 2019, overseas businesses that sell low value goods to consumers in New Zealand may need to register for, collect and return GST.
    versions:
      - effective_from: '2019-12-01'
        formula: |-
          if gst_low_value_imported_goods_subject_to_gst:
              gst_imported_goods_value * gst_standard_rate
          else:
              0
  - name: gst_low_value_imported_goods_total_payable
    kind: derived
    entity: Import
    dtype: Money
    period: Day
    unit: NZD
    source: Goods and Services Tax Act 1985 s 12; IRD low-value imported goods guidance
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/statute/act/public/1985/0141/section/12
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/guidance/ird/gst-low-value-imported-goods/block-1
              excerpt: From 1 December 2019, overseas businesses that sell low value goods to consumers in New Zealand may need to register for, collect and return GST.
    versions:
      - effective_from: '2019-12-01'
        formula: |-
          gst_imported_goods_value + gst_low_value_imported_goods_component
