format: rulespec/v1
module:
  summary: |-
    KiwiSaver Act 2006 and Inland Revenue contribution guidance set the
    core employee, employer, and Crown contribution settings used for
    contribution-rate comparison against PolicyEngine NZ. PolicyEngine NZ is
    used only as supporting-reference discovery; canonical values here are
    recorded against official statutory and agency sources.
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: nz/statute/act/public/2006/0040/section/64
units:
  - name: NZD
    kind: currency
    minor_units: 2
