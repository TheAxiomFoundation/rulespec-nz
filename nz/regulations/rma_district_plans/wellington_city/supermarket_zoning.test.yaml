# Companion tests for Wellington City 2024 District Plan supermarket zoning.
# Cases derived from the oracle grid (zone x representative GFA) used to compare
# against the NZ Initiative 'legalising groceries' atlas. Expected values are the
# PLAN-derived activity status (the encoding's authoritative reading), NOT the atlas;
# atlas divergences (MUZ >1,500 m2) are documented in the PR comparison table.
# Every case assigns every local #input fact (zone and proposed GFA).

- name: city_centre_zone_supermarket_1000m2
  period:
    period_kind: tax_year
    start: '2026-07-01'
    end: '2027-06-30'
  input:
    nz:regulations/rma_district_plans/wellington_city/supermarket_zoning#input.wcc_supermarket_zone: "CCZ"
    nz:regulations/rma_district_plans/wellington_city/supermarket_zoning#input.wcc_proposed_supermarket_gfa_m2: 1000
  output:
    nz:regulations/rma_district_plans/wellington_city/supermarket_zoning#wcc_supermarket_activity_status: "Permitted"
