  - name: acc_standard_earners_levy_excluding_gst
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: NZD
    source: Accident Compensation (Earners' Levy) Regulations 2025 regs 4, 5, and 8
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/regulation/regulation/public/2025/0018/regulation/4
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/regulation/regulation/public/2025/0018/regulation/5
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/regulation/regulation/public/2025/0018/regulation/8
    versions:
      - effective_from: '2025-04-01'
        formula: |-
          min(
              max(0, acc_earnings_for_earners_levy),
              acc_earners_levy_maximum_earnings
          ) * acc_earners_levy_rate_excluding_gst
  - name: acc_standard_earners_levy_including_gst
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: NZD
    source: Inland Revenue ACC earners' levy rates
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/regulation/regulation/public/2025/0018/regulation/4
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/regulation/regulation/public/2025/0018/regulation/5
    versions:
      - effective_from: '2025-04-01'
        formula: |-
          floor(
              (
                  min(
                      max(0, acc_earnings_for_earners_levy),
                      acc_earners_levy_maximum_earnings
                  )
                  * acc_earners_levy_rate_including_gst
                  * acc_levy_cents_rounding_scale
              )
              + (1 / 2)
          ) / acc_levy_cents_rounding_scale
  - name: acc_low_self_employed_minimum_levy_excluding_gst
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: NZD
    source: Accident Compensation (Earners' Levy) Regulations 2025 reg 6
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/regulation/regulation/public/2025/0018/regulation/6
    versions:
      - effective_from: '2025-04-01'
        formula: |-
          if acc_self_employed_more_than_30_hours_per_week and acc_self_employed_earnings_for_earners_levy < acc_low_self_employed_minimum_earnings:
              acc_earners_levy_rate_excluding_gst
              * max(
                  0,
                  acc_low_self_employed_minimum_earnings
                  - acc_employee_earnings_for_low_self_employed_formula
              )
          else:
              0
  - name: acc_weekly_compensation_purchase_levy_excluding_gst
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: NZD
    source: Accident Compensation (Earners' Levy) Regulations 2025 reg 7
    metadata:
      proof:
        atoms:
