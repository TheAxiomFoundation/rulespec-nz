  - name: acc_rd3b_applies_to_shareholder_employee
    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
    source: Income Tax Act 2007 s RD 3B(1)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: nz/statute/act/public/2007/0097/section/rd-3b
              excerpt: |-
                This section applies for an income year for a person who is a shareholder and an employee of a company that is not a look-through company and is a close company or has 25 or fewer shareholders if the person elects to apply this section and —
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: nz/statute/act/public/2007/0097/section/rd-3b
              excerpt: |-
                the person does not derive as an employee payments of salary or wages of a regular amount for regular pay periods of 1 month or less throughout the income year:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: nz/statute/act/public/2007/0097/section/rd-3b
              excerpt: |-
                the person derives less than 66% of their annual gross income as an employee from payments of salary or wages of a regular amount for regular pay periods throughout the income year:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: nz/statute/act/public/2007/0097/section/rd-3b
              excerpt: |-
                an amount is paid as income that may later be allocated to the person as an employee for the income year.
    versions:
      - effective_from: '2025-04-01'
        formula: |-
          (
              acc_person_is_shareholder_of_company
              and acc_person_is_employee_of_company
              and not acc_company_is_look_through_company
              and (
                  acc_company_is_close_company
                  or acc_company_has_25_or_fewer_shareholders
              )
              and acc_person_elected_rd3b
              and (
                  not acc_shareholder_employee_receives_regular_salary_or_wages_for_pay_periods_one_month_or_less_throughout_year
                  or (
                      acc_shareholder_employee_regular_salary_or_wages_paid
                      < (
                          acc_rd3b_regular_salary_annual_gross_income_threshold
                          * acc_shareholder_employee_annual_gross_income
                      )
                  )
                  or acc_shareholder_employee_income_paid_that_may_later_be_allocated > 0
              )
          )
