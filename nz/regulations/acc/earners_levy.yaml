            kind: formula
            source:
              corpus_citation_path: nz/regulation/regulation/public/2025/0018/regulation/7
    versions:
      - effective_from: '2025-04-01'
        formula: |-
          if acc_self_employed_purchases_weekly_compensation:
              (
                  acc_earners_levy_rate_excluding_gst
                  * acc_weekly_compensation_purchase_multiplier
                  * acc_agreed_weekly_compensation_purchased_annual_amount
              )
          else:
              0
  - name: acc_self_employed_invoice_levy_payable_after_exempt_amount
    kind: derived
    entity: Invoice
    dtype: Money
    period: Day
    unit: NZD
    source: Accident Compensation (Earners' Levy) Regulations 2025 reg 9
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/regulation/regulation/public/2025/0018/regulation/9
    versions:
      - effective_from: '2025-04-01'
        formula: |-
          if acc_invoice_issued_to_self_employed_person_for_acc_act_purposes and acc_invoice_includes_earners_levy and acc_self_employed_invoice_acc_levy_amount <= acc_self_employed_invoice_exempt_amount:
              0
          else:
              acc_self_employed_invoice_acc_levy_amount
