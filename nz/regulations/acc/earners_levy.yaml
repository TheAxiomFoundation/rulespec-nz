format: rulespec/v1
module:
  summary: |-
    Accident Compensation (Earners' Levy) Regulations 2025 regulations 4 and 5
    set the earners' levy rate and maximum earnings cap for the 2025/26,
    2026/27, and 2027/28 tax years. Regulations 6 and 7 set the special
    formulas for low-earning self-employed persons who work more than 30 hours
    per week and for self-employed persons who purchase weekly compensation.
    Regulation 8 states that the regulatory levy amounts exclude GST. Inland
    Revenue publishes the PAYE-facing rates and maximum levy amounts including
    GST.
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: nz/regulation/regulation/public/2025/0018/regulation/4
units:
  - name: NZD
    kind: currency
    minor_units: 2
