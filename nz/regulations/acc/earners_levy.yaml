format: rulespec/v1
module:
  summary: |-
    The Accident Compensation Act 2001 sections 6 and 9 to 15 derive an
    earner's levy earnings base from employee, self-employed, and
    shareholder-employee earnings. Section 221 and Inland Revenue guidance
    make the employee deduction at payment time using the rate that applies on
    the pay date. The Accident Compensation (Earners' Levy) Regulations 2025
    regulations 4 to 9 set levy rates, maximum liable earnings, special
    self-employed formulas, GST treatment, and the invoice exemption. The
    Goods and Services Tax Act 1985 supplies the 15 percent GST factor.
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: nz/regulation/regulation/public/2025/0018/regulation/4
units:
  - name: NZD
    kind: currency
    minor_units: 2
