format: rulespec/v1
module:
  summary: |-
    Health Entitlement Cards Regulations 1993 Part 1 defines Community
    Services Card eligibility, issue powers, SuperGold Card coding, card
    commencement and expiry limits, and income ascertainment. This module
    encodes the current regulation 8 eligibility routes and the 2026 income
    thresholds. Cross-Act predicates such as Social Security Act benefit
    entitlement, Income Tax Act family assistance credit entitlement, social
    housing tenancy, Veterans' Support Act compensation, and Pae Ora-funded
    residential care disability services are factual inputs pending dedicated
    cross-module wiring.
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: nz/regulation/regulation/public/1993/0169/regulation/8
units:
  - name: NZD
    kind: currency
    minor_units: 2
