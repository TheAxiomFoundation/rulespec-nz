    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/regulation/regulation/public/1993/0169/regulation/8
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if community_services_card_person_married_or_partnered:
              community_services_card_superannuation_income_limit_partnered
          else:
              if community_services_card_single_person_living_alone:
                  community_services_card_superannuation_income_limit_single_living_alone
              else:
                  community_services_card_superannuation_income_limit_single_shared_accommodation
  - name: community_services_card_family_credit_income_additional_person_count
    kind: derived
    entity: Person
    dtype: Count
    period: Year
    source: Health Entitlement Cards Regulations 1993 reg 8(6)(e)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/regulation/regulation/public/1993/0169/regulation/8
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if (
              community_services_card_family_size
              <= community_services_card_family_credit_income_limit_six_person_family_size
          ):
              0
          else:
              (
                  community_services_card_family_size
                  - community_services_card_family_credit_income_limit_six_person_family_size
              )
  - name: community_services_card_family_credit_income_limit
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: NZD
    source: Health Entitlement Cards Regulations 1993 reg 8(6) and (7)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/regulation/regulation/public/1993/0169/regulation/8
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if community_services_card_family_size <= 2:
              community_services_card_family_credit_income_limit_two_person_family
          else:
              if community_services_card_family_size == 3:
                  community_services_card_family_credit_income_limit_three_person_family
              else:
                  if community_services_card_family_size == 4:
                      community_services_card_family_credit_income_limit_four_person_family
                  else:
                      if community_services_card_family_size == 5:
                          community_services_card_family_credit_income_limit_five_person_family
                      else:
                          (
                              community_services_card_family_credit_income_limit_six_person_family
                              + community_services_card_family_credit_income_additional_person_count
                              * community_services_card_family_credit_income_limit_each_additional_person
                          )
  - name: community_services_card_family_income_under_limit
    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
    source: Health Entitlement Cards Regulations 1993 reg 8(1)(d), 8(1)(f), and 8(5)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/regulation/regulation/public/1993/0169/regulation/8
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          community_services_card_assessed_family_income <= community_services_card_family_income_limit
  - name: community_services_card_superannuation_income_under_limit
    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
