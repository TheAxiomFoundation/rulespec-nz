          community_services_card_assessed_family_credit_income <= community_services_card_family_credit_income_limit
  - name: community_services_card_family_group_for_dependent_child_threshold
    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
    source: Health Entitlement Cards Regulations 1993 reg 8(7)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/regulation/regulation/public/1993/0169/regulation/8
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          (
              community_services_card_family_adult_count
              >= community_services_card_family_definition_minimum_adults
              and community_services_card_family_adult_count
              <= community_services_card_family_definition_maximum_adults
              and community_services_card_dependent_children_count >= 1
          )
  - name: community_services_card_family_assistance_credit_entitlement
    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
    source: Health Entitlement Cards Regulations 1993 reg 8(4)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/regulation/regulation/public/1993/0169/regulation/8
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          (
              community_services_card_receives_current_family_assistance_credit_instalments
              or community_services_card_received_family_assistance_credit_in_preceding_tax_year
          )
  - name: community_services_card_main_benefit_route
    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
    source: Health Entitlement Cards Regulations 1993 reg 8(1)(a)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/regulation/regulation/public/1993/0169/regulation/8
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          (
              community_services_card_applied_for_and_entitled_to_sole_parent_support
              or community_services_card_applied_for_and_entitled_to_supported_living_payment
              or community_services_card_applied_for_and_entitled_to_jobseeker_support
              or community_services_card_applied_for_and_entitled_to_emergency_benefit_instead_of_listed_main_benefit
              or community_services_card_applied_for_and_entitled_to_veterans_pension
              or community_services_card_applied_for_and_entitled_to_youth_payment
              or community_services_card_applied_for_and_entitled_to_young_parent_payment
              or community_services_card_applied_for_and_entitled_to_accommodation_supplement
          )
  - name: community_services_card_veterans_support_compensation_route
    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
    source: Health Entitlement Cards Regulations 1993 reg 8(1)(ab)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/regulation/regulation/public/1993/0169/regulation/8
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          (
              community_services_card_receiving_veterans_support_weekly_income_compensation
              or community_services_card_receiving_veterans_support_weekly_compensation
          )
  - name: community_services_card_child_benefit_route
    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
    source: Health Entitlement Cards Regulations 1993 reg 8(1)(b)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/regulation/regulation/public/1993/0169/regulation/8
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          (
              community_services_card_person_is_child
              and (
                  community_services_card_orphans_benefit_payable_for_person
                  or community_services_card_unsupported_childs_benefit_payable_for_person
                  or community_services_card_child_disability_allowance_payable_for_person
              )
          )
  - name: community_services_card_dependent_children_income_route
    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
    source: Health Entitlement Cards Regulations 1993 reg 8(1)(c)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/regulation/regulation/public/1993/0169/regulation/8
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          (
              community_services_card_family_group_for_dependent_child_threshold
              and community_services_card_family_credit_income_under_limit
              and (
                  community_services_card_ordinarily_resident_in_new_zealand
                  or community_services_card_family_assistance_credit_entitlement
              )
          )
  - name: community_services_card_no_dependent_children_income_route
    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
    source: Health Entitlement Cards Regulations 1993 reg 8(1)(d)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/regulation/regulation/public/1993/0169/regulation/8
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          (
              community_services_card_family_income_under_limit
              and community_services_card_dependent_children_count == 0
              and community_services_card_ordinarily_resident_in_new_zealand
              and community_services_card_person_age_years
              >= community_services_card_minimum_age_without_dependent_children
              and not community_services_card_person_is_dependent_child
              and not community_services_card_person_age_would_entitle_another_person_to_family_assistance_credit
              and not community_services_card_person_is_superannuitant
              and not community_services_card_receives_veterans_pension
              and not community_services_card_spouse_or_partner_receives_grandparented_nz_super_or_veterans_pension_rate
              and not community_services_card_receiving_veterans_support_weekly_income_compensation
              and not community_services_card_receiving_veterans_support_weekly_compensation
          )
  - name: community_services_card_superannuitant_route
    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
    source: Health Entitlement Cards Regulations 1993 reg 8(1)(e)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/regulation/regulation/public/1993/0169/regulation/8
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          (
              community_services_card_person_is_superannuitant
              and community_services_card_superannuation_income_under_limit
          )
  - name: community_services_card_student_route
