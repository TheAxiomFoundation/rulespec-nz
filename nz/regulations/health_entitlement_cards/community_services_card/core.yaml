  - name: community_services_card_family_credit_income_under_limit
    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
    source: Health Entitlement Cards Regulations 1993 reg 8(1)(c) and 8(6)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/regulation/regulation/public/1993/0169/regulation/8
