            kind: formula
            source:
              corpus_citation_path: nz/regulation/regulation/public/1993/0169/regulation/8
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if community_services_card_person_married_or_partnered:
              community_services_card_family_income_limit_partnered
          else:
              if community_services_card_single_person_living_alone:
                  community_services_card_family_income_limit_single_living_alone
              else:
                  community_services_card_family_income_limit_single_shared_accommodation
  - name: community_services_card_superannuation_income_limit
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: NZD
