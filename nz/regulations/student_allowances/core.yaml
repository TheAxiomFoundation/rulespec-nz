format: rulespec/v1
module:
  summary: |-
    Student Allowances Regulations 1998 (SR 1998/277), the Education and
    Training Act 2020, and official StudyLink guidance define the current
    student allowance rate, partner, and parental-income surfaces encoded
    here.
  status: active
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: nz/regulation/regulation/public/1998/0277/schedule/2/part/1/subpart/2/clause/3
units:
  - name: NZD
    kind: currency
    minor_units: 2
rules:
  - name: student_allowance_parents_living_apart_abatement
    kind: parameter
    dtype: Money
    unit: NZD
    source: Student Allowances Regulations 1998 reg 4(2)(da)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: nz/regulation/regulation/public/1998/0277/regulation/4
              excerpt: the combined parental income of the parents of the student is considered to be reduced by $3,400
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          3400
  - name: student_allowance_other_dependent_students_abatement
    kind: parameter
    dtype: Money
    unit: NZD
    source: Student Allowances Regulations 1998 reg 4(2)(d)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: nz/regulation/regulation/public/1998/0277/regulation/4
              excerpt: the combined parental income of the parents of that student is considered to be reduced by $7,000 for each such additional dependent student
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          7000
  - name: student_allowance_parental_income_upper_limit_at_home
    kind: parameter
    dtype: Money
    unit: NZD
    source: StudyLink parental-income guidance
    metadata:
