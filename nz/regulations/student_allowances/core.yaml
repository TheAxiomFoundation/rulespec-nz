  - name: student_allowance_annual_parental_income
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: NZD
    source: Student Allowances Regulations 1998 reg 4
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/regulation/regulation/public/1998/0277/regulation/4
              excerpt: the combined parental incomes of those 2 contributors is considered to be the parental income of the student
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: nz/regulation/regulation/public/1998/0277/regulation/4
              excerpt: where the income of a parent of a student is negative, it must be treated as nil.
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if student_allowance_parents_living_apart:
              max(0, max(0, student_allowance_parent1_annual_income) + max(0, student_allowance_parent2_annual_income) - student_allowance_parents_living_apart_abatement - student_allowance_dependent_students_count * student_allowance_other_dependent_students_abatement)
          else:
              max(0, max(0, student_allowance_parent1_annual_income) + max(0, student_allowance_parent2_annual_income) - student_allowance_dependent_students_count * student_allowance_other_dependent_students_abatement)
  - name: student_allowance_weekly_parental_income
    kind: derived
    entity: Person
    dtype: Money
    period: Week
    unit: NZD
    source: Student Allowances Regulations 1998 reg 2
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/regulation/regulation/public/1998/0277/regulation/2
              excerpt: weekly parental income , in relation to any person, means the amount of parental income in relation to that person divided by 52.
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          student_allowance_annual_parental_income / student_allowance_parental_income_weeks_per_year
  - name: student_allowance_weekly_student_income
    kind: derived
    entity: Person
    dtype: Money
    period: Week
    unit: NZD
    source: Student Allowances Regulations 1998 reg 43
    metadata:
