            kind: formula
            source:
              corpus_citation_path: nz/regulation/regulation/public/1998/0277/regulation/43
              excerpt: Where the personal income or combined income of a person for a week is required to be calculated for the purposes of these regulations
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          student_allowance_student_personal_income_for_week
  - name: student_allowance_weekly_partner_income
    kind: derived
    entity: Person
    dtype: Money
    period: Week
    unit: NZD
    source: Student Allowances Regulations 1998 reg 43
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/regulation/regulation/public/1998/0277/regulation/43
              excerpt: Where the personal income or combined income of a person for a week is required to be calculated for the purposes of these regulations
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if student_allowance_has_recognised_partner > 0:
              student_allowance_partner_personal_income_for_week
          else:
              0
  - name: student_allowance_combined_weekly_income
    kind: derived
    entity: Person
    dtype: Money
    period: Week
    unit: NZD
    source: Student Allowances Regulations 1998 reg 2
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/regulation/regulation/public/1998/0277/regulation/2
              excerpt: the personal income of that student; and
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/regulation/regulation/public/1998/0277/regulation/2
              excerpt: the spousal or partner's income of that student
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          student_allowance_weekly_student_income + student_allowance_weekly_partner_income
  - name: student_allowance_has_recognised_partner
    kind: derived
    entity: Person
    dtype: Rate
    source: Student Allowances Regulations 1998 reg 2
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: nz/regulation/regulation/public/1998/0277/regulation/2
              excerpt: both of them are of or over 24 ; or
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: nz/regulation/regulation/public/1998/0277/regulation/2
              excerpt: one or both of them are younger than 24 and at least 1 of them has a supported child
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if student_allowance_has_partner and (
              (
                  student_allowance_student_age >= student_allowance_partner_age_threshold
                  and student_allowance_partner_age >= student_allowance_partner_age_threshold
              )
              or student_allowance_has_children
          ):
              1
          else:
              0
  - name: student_allowance_lives_at_home
    kind: derived
    entity: Person
    dtype: Rate
    source: Student Allowances Regulations 1998 reg 2 and Schedule 2 clause 2
