        formula: |-
          141451.55
  - name: student_allowance_parental_income_first_band_width_at_home
    kind: parameter
    dtype: Money
    unit: NZD
    source: Student Allowances Regulations 1998 Schedule 2 clause 3(4)
    metadata:
