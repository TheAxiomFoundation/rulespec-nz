format: rulespec/v1
module:
  summary: |-
    Student Allowances Regulations 1998 (SR 1998/277), the Education and
    Training Act 2020, and official StudyLink guidance define the current
    student allowance rate, partner, and parental-income surfaces encoded
    here.
  status: active
  source_verification:
    corpus_citation_paths:
      - nz/regulation/1998/0277
      - nz/statute/act/public/2011/0067
      - nz/agency/tec/student-allowances
    agency_reference_urls:
      - https://www.studylink.govt.nz/student-allowance
      - https://www.studylink.govt.nz/products/rates/calculators/parental-income-calculator.html
      - https://www.studylink.govt.nz/products/rates/calculators/student-allowance-rate-calculator.html
      - https://www.tec.govt.nz/funding/funding-and-performance/funding/funding-for-providers/student-allowances
    oracle_links:
      - openfisca-aotearoa
units:
  - name: NZD
    kind: currency
    minor_units: 2
