              excerpt: (30.30303% × (the amount of item A up to a maximum of $71.41)) + (27.93296% × (any amount of item A exceeding $71.41)) where A is the average gross weekly income of the student’s parents or parent less $1,386.71.
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          71.41
